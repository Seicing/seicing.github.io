<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #252525;
        align-items: center;
    }

    #container {
        position: relative;
        width: min(100vw, calc(100vh * 16 / 9));
        aspect-ratio: 16 / 9;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    /* 底部工具条定位容器 */
    #toolbar-container {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        justify-content: center;
        width: 100%;
        z-index: 9999;
        /* 极高层级，防止被网站其他元素遮挡 */
        pointer-events: none;
        /* 容器本身不阻挡点击，让点击穿透到网页 */
    }

    /* 旗帜选择面板 */
    #panel {
        pointer-events: auto;
        /* 恢复面板本身的点击响应 */
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: rgba(15, 15, 15, 0.85);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        max-width: 90vw;
        overflow-x: auto;
        transition: opacity 0.3s ease, transform 0.3s ease;
    }

    /* 面板隐藏样式 */
    #panel.hidden {
        opacity: 0;
        pointer-events: none;
        /* 隐藏时不再响应点击 */
        transform: translateY(20px);
    }

    /* 单个旗帜按钮 - 宽度限定 50px */
    .flag-btn {
        width: 50px;
        height: 32px;
        flex-shrink: 0;
        border: 2px solid transparent;
        border-radius: 4px;
        background: #333;
        padding: 0;
        cursor: pointer;
        overflow: hidden;
        transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .flag-btn img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        pointer-events: none;
        /* 防止图片吞掉点击事件 */
    }

    .flag-btn:hover {
        transform: scale(1.08);
        border-color: #888;
    }

    .flag-btn.active {
        border-color: #ffcc00;
        box-shadow: 0 0 8px rgba(255, 204, 0, 0.6);
    }

    #sidebar-toggle-button {
        display: none !important;
    }
</style>

        (function () {
            const getCookie = (name) => {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            };
            const theme = getCookie('theme') || 'light';
            if (theme === 'dark') {
                document.body.classList.add('theme-dark');
            }
        })();

<script>

    const flagList = [

        { id: 3, name: "中国", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Chinese.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_chinese.webp" },
        { id: 4, name: "苏格兰", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Scots.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_sco.webp" },
        { id: 5, name: "金朝", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Jindynasty.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/Jin_Dynasty.webp" },
        { id: 6, name: "维京", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Vikings.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_vik.webp" },
        { id: 7, name: "圣殿骑士团", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Knightstemplar.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_knights_templar.webp" },
        { id: 8, name: "朱子遗训", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-ZhuXiLegacy.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_historic_chi.webp" },
        { id: 9, name: "黑衣大食王朝", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Abbasiddynasty.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_abbasid.webp" },
        { id: 10, name: "阿尤布", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Ayyubids.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_historic_abb.webp" },
        { id: 11, name: "德里苏丹国", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Delhisultanate.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_sultanates.webp" },
        { id: 12, name: "英格兰", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-English.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_english.webp" },
        { id: 13, name: "法兰西", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-French.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_french.webp" },
        { id: 14, name: "金帐汗国", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Goldenhorde.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/Golden_Horde_AoE4.webp" },

        { id: 16, name: "日本", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Japanese.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_japanese.webp" },
        { id: 17, name: "圣女贞德", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Jeannedarc.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_historic_fre.webp" },
        { id: 18, name: "马其顿王朝", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Macedoniandynasty.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/Macedonian_Dynasty_AoE4.webp" },
        { id: 19, name: "马里", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Malians.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_malian.webp" },
        { id: 20, name: "蒙古", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Mongols.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_mongol.webp" },
        { id: 21, name: "龙之骑士团", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Orderofthedragon.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_historic_hre.webp" },
        { id: 22, name: "奥斯曼", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Ottomans.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_ottoman.webp" },
        { id: 23, name: "罗斯", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Rus.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/flag_rus.webp" },
        { id: 24, name: "战国大名", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Sengokudaimyo.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/Sengoku_Daimyo_AoE4.webp" },
        { id: 25, name: "图格鲁克王朝", icon: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/CivIcon-Tughlaqdynasty.png", flag: "https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/flag/Tughlaq_Dynasty_AoE4.webp" },
    ];

    // ========================
    // 2. 动画与渲染核心
    // ========================
    const canvas = document.getElementById("flagCanvas");
    const ctx = canvas.getContext("2d", { alpha: false }); // 优化性能

    const settings = {
        amplitude: 10,
        wavelength: 600,
        speed: 0.5,
        segments: 120,
        shading: 0
    };

    let currentImg = new Image();
    let animationReady = false;
    let animationStart = performance.now();

    // 切换旗帜大图函数
    function switchFlag(flagSrc) {
        animationReady = false;
        const tempImg = new Image();
        tempImg.src = flagSrc;
        tempImg.onload = () => {
            currentImg = tempImg;
            animationReady = true;
        };
    }

    function drawFlag(time) {
        // 修复缩小不显示的问题：动态获取实际渲染尺寸并赋予 canvas 真实分辨率
        const rect = canvas.getBoundingClientRect();
        if (rect.width > 0 && rect.height > 0) {
            const dpr = window.devicePixelRatio || 1;
            const targetW = Math.round(rect.width * dpr);
            const targetH = Math.round(rect.height * dpr);

            if (canvas.width !== targetW || canvas.height !== targetH) {
                canvas.width = targetW;
                canvas.height = targetH;
            }
        } else {
            return; // 如果容器完全不可见则跳过绘制
        }

        ctx.fillStyle = "#252525"; // 填充背景防黑边
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cols = settings.segments;
        const rows = Math.ceil(cols * currentImg.height / currentImg.width);
        const cellW = currentImg.width / cols;
        const cellH = currentImg.height / rows;

        const scale = Math.min(
            canvas.width / currentImg.width,
            canvas.height / currentImg.height
        );

        const offsetX = (canvas.width - currentImg.width * scale) / 2;
        const offsetY = (canvas.height - currentImg.height * scale) / 2;

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                const sx = x * cellW;
                const sy = y * cellH;
                const sw = Math.min(cellW, currentImg.width - sx);
                const sh = Math.min(cellH, currentImg.height - sy);

                if (sw <= 0 || sh <= 0) continue; // 防止浏览器绘制异常

                const nx = sx / currentImg.width;
                const ny = sy / currentImg.height;
                const waveStrength = Math.pow(nx, 0.8);

                const phase = nx * currentImg.width / settings.wavelength - time;
                const wave = Math.sin(phase * Math.PI * 2 + ny * 0.8) * settings.amplitude * waveStrength;
                const secondary = Math.sin(phase * Math.PI * 4 - time * 0.6) * settings.amplitude * 0.2 * waveStrength;
                const displacement = wave + secondary;

                const dx = offsetX + sx * scale;
                const dy = offsetY + (sy + displacement) * scale;
                const dw = sw * scale + 1.2; // 稍微增加补偿，防止网格裂缝
                const dh = sh * scale + 1.2;

                ctx.drawImage(currentImg, sx, sy, sw, sh, dx, dy, dw, dh);

                const light = Math.cos(phase * Math.PI * 2 + ny * 0.8) * settings.shading * waveStrength;
                if (light < 0) {
                    ctx.fillStyle = `rgba(0,0,0,${-light})`;
                } else {
                    ctx.fillStyle = `rgba(255,255,255,${light * 0.45})`;
                }
                ctx.fillRect(dx, dy, dw, dh);
            }
        }
    }

    function animate(now) {
        if (animationReady) {
            const time = (now - animationStart) / 1000 * settings.speed;
            drawFlag(time);
        }
        requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // ========================
    // 3. 面板与全局点击逻辑
    // ========================
    const panel = document.getElementById("panel");

    // 动态生成按钮
    flagList.forEach((item, index) => {
        const btn = document.createElement("button");
        btn.className = "flag-btn";
        btn.title = item.name || `旗帜 ${index + 1}`;

        const iconImg = document.createElement("img");
        iconImg.src = item.icon;

        btn.appendChild(iconImg);

        btn.addEventListener("click", () => {
            document.querySelectorAll(".flag-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            switchFlag(item.flag);
        });

        panel.appendChild(btn);
    });

    // 默认激活加载第一项
    if (flagList.length > 0) {
        const firstBtn = panel.querySelector(".flag-btn");
        if (firstBtn) firstBtn.classList.add("active");
        switchFlag(flagList[0].flag);
    }

    // 点击网页任意位置隐藏/显示面板
    document.addEventListener("click", (e) => {
        // 如果点击的是面板里面的按钮，则不触发隐藏/显示（让按钮的正常功能执行）
        if (panel.contains(e.target)) {
            return;
        }
        // 点击网页的其他地方则翻转面板状态
        panel.classList.toggle("hidden");
    });
</script>
