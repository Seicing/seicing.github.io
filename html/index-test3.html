    /* 整体容器：留出顶部空间以便立绘探头 */
    .dialogue-stage-wrapper {

    .dialogue-text {

    /* 立绘图层容器：贴住右边和下边，仅 1px 间距 */
    .stage {
        position: absolute;

        bottom: 1px;
        width: 150px;
        height: 225px;
        pointer-events: none;
        z-index: 10;

        /* 关键：左侧 0~20px 渐变透明遮罩 (兼容 Webkit 内核) */
        -webkit-mask-image: linear-gradient(to right, transparent 0px, black 20px, black 100%);
        mask-image: linear-gradient(to right, transparent 0px, black 20px, black 100%);
    }

    /* 让立绘所有图层的右下角带有 10px 圆角，贴合对话框 */
    .stage img {
        width: 150px;
        display: block;
        border-bottom-right-radius: 10px;

    }

    .layer {
        position: absolute;
        bottom: 0;
        left: 0;
    }

    img {
        width: 150px;
        display: block;
    }

    #customDialogueInput {
        width: 492px;

        padding: 8px;

        border-radius: 6px;
        border: 1px solid #999;

        resize: vertical;
        margin-bottom: 10px;
        display: block;
    }

    button {

        padding: 5px 10px;

    button.active {
        background: #c0392b;
        color: #fff;
        border: 1px solid #a93226;
    }

    button.disabled {
        opacity: 0.4;
        cursor: not-allowed;
        pointer-events: none;
    }

    }

    .avatar-wrap {

    .avatar-badge {

        pointer-events: none;
        z-index: 10;
    }

    .sidebar-lavivagnar {

    /* 🟢 仅在电脑模式（宽屏）下向左偏移 10px */
    @media screen and (min-width: 769px) {

</style>

<script>
    /* ========= Cookie 存取工具函数 ========= */
    function setCookie(name, value, days = 30) {
        const expires = new Date(Date.now() + days * 864e5).toUTCString();
        document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + expires + '; path=/';
    }

    function getCookie(name) {
        return document.cookie.split('; ').reduce((r, v) => {
            const parts = v.split('=');
            return parts[0] === name ? decodeURIComponent(parts[1]) : r;
        }, '');
    }

    /* ========= 角色名字映射表 ========= */
    const charNameMap = {};

    function updateSpeakerName(id) {
        id = id || document.getElementById("charId").value.trim();
        const speakerNameEl = document.getElementById("speakerName");
        if (!speakerNameEl) return;
        if (charNameMap[id]) {
            speakerNameEl.textContent = charNameMap[id];
        } else {
            speakerNameEl.textContent = "余"; // 查不到时默认回退
        }
    }

    async function loadCharNameMap() {
        try {
            const [res1, res2] = await Promise.allSettled([
                fetch('https://seicing.com/js/dialogid.json').then(r => r.ok ? r.json() : []),
                fetch('https://seicing.com/js/dialogid2.json').then(r => r.ok ? r.json() : [])
            ]);

            const list1 = res1.status === 'fulfilled' && Array.isArray(res1.value) ? res1.value : [];
            const list2 = res2.status === 'fulfilled' && Array.isArray(res2.value) ? res2.value : [];

            [...list1, ...list2].forEach(item => {
                if (item && item.inner) {
                    charNameMap[item.inner] = item.outer || item.inner;
                }
            });

            // 映射表加载完成后立即更新一次当前角色名
            updateSpeakerName();
        } catch (err) {
            console.error("加载名字对照表失败:", err);
        }
    }

    /* ========= 表情表 ========= */
    const faces = {
        smile: ["eye_default1", "eye_default2", "eye_default3", "brow_default", "mouth_smile"],
        serene: ["eye_default1", "eye_default2", "eye_default3", "brow_default", "mouth_serene"],
        sad: ["eye_default1", "eye_default2", "eye_default3", "brow_sad", "mouth_sad"],
        depress: ["eye_depress1", "eye_default2", "eye_default3", "brow_default", "mouth_depress"],
        sinister: ["eye_depress1", "eye_default2", "eye_default3", "brow_default", "mouth_sinister"],
        surprise: ["eye_surprise1", "eye_default2", "eye_default3", "brow_default", "mouth_surprise"],
        side: ["eye_side1", "eye_side2", "eye_default3", "brow_default", "mouth_serene"],
        shy: ["eye_side1", "eye_side2", "eye_default3", "brow_default", "mouth_smile"],
        happy: ["eye_default1", "eye_default2", "eye_default3", "brow_default", "mouth_happy"],
        bitter: ["eye_default1", "eye_default2", "eye_default3", "brow_sad", "mouth_happy"],
        wry: ["eye_default1", "eye_default2", "eye_default3", "brow_sad", "mouth_smile"],
        cry: ["eye_cry1", "eye_cry2", "eye_cry3", "brow_sad", "mouth_cry"],
        bawl: ["eye_cry1", "eye_cry2", "eye_cry3", "brow_sad", "mouth_angry"],
        crysurprise: ["eye_cry1", "eye_cry2", "eye_cry3", "brow_sad", "mouth_surprise"],
        cryhappy: ["eye_cry1", "eye_cry2", "eye_cry3", "brow_sad", "mouth_happy"],
        fear: ["eye_default1", "eye_default2", "eye_default3", "brow_sad", "mouth_panic"],
        endure: ["eye_depress1", "eye_default2", "eye_default3", "brow_sad", "mouth_endure"],
        uncomfortable: ["eye_default1", "eye_default2", "eye_default3", "brow_sad", "mouth_cry"],
        angry: ["eye_surprise1", "eye_default2", "eye_default3", "brow_angry", "mouth_angry"],
        excited: ["eye_surprise1", "eye_default2", "eye_default3", "brow_angry", "mouth_excited"],
        extra1: ["eye_extra1", "eye_extra1", "eye_extra1", "eye_extra1", "mouth_extra1"],
        extra2: ["eye_extra2", "eye_extra2", "eye_extra2", "eye_extra2", "mouth_extra2"],
        extra3: ["eye_extra3", "eye_extra3", "eye_extra3", "eye_extra3", "mouth_extra3"],
        extra4: ["eye_extra4", "eye_extra4", "eye_extra4", "eye_extra4", "mouth_extra4"],
        extra5: ["eye_extra5", "eye_extra5", "eye_extra5", "eye_extra5", "mouth_extra5"]
    };

    const fullyAnimatedList = [
        "YoEmpireFlower", "YoTngriDaruga", "YoTngriDarugaAtavism", "YoEmpress", "YoBorteCino", "VenAcolyte", "VenHierophant", "VenCelestial", "VenEpisode", "IrisMrazKralitsata", "IrisPratenitsa", "IrisEpisode", "IuimiAcolyte", "IuimiFlameEmpress", "IuimiAcalanatha", "IuimiEpisode2", "IuimiEpisode3", "IuimiEpisode", "SeigineScholar", "SeicingAcolyte", "SeicingAcolyte2", "SeicingEmpireJade", "SeicingWanderer", "AlterrataCleric", "AlterrataWizard", "CiyauCleric", "CiyauPhalanx", "CiyauSkirmisher", "CiyauSentinel", "KhazatarCommonFemale", "KhazatarRanger", "KhazatarCleric", "Kruv", "KruvAtavism", "Khazard", "Sherazard", "AragonCoastal", "Aziz", "Byinn", "Chunlan", "Chunlen", "Meirei", "Okichi", "Prithvi", "SarchlentAdventurer", "SarchlentConqueror", "Sri", "Yunpyeng", "YoEpisode", "IrisEpisode2", "VenEpisode2", "YoEpisode2", "Utari", "UtariAtavism", "Gizeiger", "Chinkoo", "Gaoh", "LouichWanderer", "LouichRozenSchutze", "SeigineSentinel", "SeigineRanger",  /* "Alitta", "Seigent", "SeigentAtavism", "SeicingEpisode2", "Souun", "Chen", "Chimon", "Orlok", "OrlokAtavism", "Gennai", "SeigineMage", "SeigineCleric", "SeigineWizard", "SeigineCommonMale", "SeigineCommonFemale", "CiyauCommonMale", "CiyauCommonFemale", "CiyauRecruit", "CiyauDevastator", "AlterrataCommonMale", "AlterrataCommonFemale", */
    ];

    const BADGE_IMG_SRC = "https://data.seicing.com/seicingdepot/fatcatpool/essay/ClickUp/mark.png";

    /* ========= 状态 ========= */
    let charPath = "";
    let currentFace = faces.serene || faces.smile;
    let blinkTimer = null;
    let talkTimer = null;
    let talking = false;
    let talkMode = 1;
    let isClosedEyes = false;

    /* ========= 眨眼参数 ========= */
    let blinkMin = 100;
    let blinkMax = 3000;
    const blinkFrameTime = 80;
    const blinkHoldFactor = 2;

    /* ========= DOM ========= */
    const eye = document.getElementById("eye");
    const brow = document.getElementById("brow");
    const mouth = document.getElementById("mouth");
    const base = document.getElementById("base");

    const acc = {
        attach: document.getElementById("attach"),
        special: document.getElementById("special"),
        sweat: document.getElementById("sweat"),
        red_face: document.getElementById("red_face")
    };

    /* ========= 说话帧 ========= */
    const talkRandomFrames = [
        "mouth_serene", "mouth_endure", "mouth_surprise", "mouth_endure",
    ];

    const talkSeqFrames = [
        "mouth_ani1", "mouth_ani2", "mouth_ani3", "mouth_ani2",
    ];

    /* ========= 工具 ========= */
    function src(name) {
        return charPath + name + ".png";
    }

    /* ========= 改造版：首轮即刻可用 + 后台静默复检补救 ========= */
    function preloadImages(callback) {
        const statusEl = document.getElementById("loadStatus");
        const btn = document.getElementById("loadBtn");
        if (btn) btn.disabled = true;

        // 1. 必备的核心图片（优先加载 + 强行重试）
        const CORE_IMAGES = ["base", "eye_default1", "brow_default"];
        const failedImages = new Set();

        // 2. 收集所有其他待检测图片
        const otherImages = new Set();
        Object.values(faces).forEach(arr => arr.forEach(imgName => otherImages.add(imgName)));
        if (typeof talkRandomFrames !== 'undefined') talkRandomFrames.forEach(n => otherImages.add(n));
        if (typeof talkSeqFrames !== 'undefined') talkSeqFrames.forEach(n => otherImages.add(n));
        Object.keys(acc).forEach(k => otherImages.add(k));

        // 排除核心图片，避免重复
        CORE_IMAGES.forEach(name => otherImages.delete(name));

        const totalTasks = CORE_IMAGES.length + otherImages.size;
        let completedCount = 0;

        function updateProgress(text) {
            if (statusEl) {
                statusEl.textContent = text || `资源预加载: ${completedCount}/${totalTasks}`;
            }
        }

        // --- 核心图片加载器（带失败立即重试） ---
        function loadCoreImage(imgName, retryCount = 0) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => {
                    completedCount++;
                    updateProgress();
                    resolve(true);
                };
                img.onerror = () => {
                    if (retryCount < 2) {
                        setTimeout(() => {
                            loadCoreImage(imgName, retryCount + 1).then(resolve);
                        }, 100);
                    } else {
                        failedImages.add(imgName);
                        completedCount++;
                        updateProgress();
                        resolve(false);
                    }
                };
                img.src = src(imgName);
            });
        }

        // --- 通用单轮批量加载器 ---
        function batchLoad(imageSet, isPass1 = true) {
            return new Promise(resolve => {
                if (imageSet.size === 0) {
                    resolve({ succeeded: new Set(), failed: new Set() });
                    return;
                }

                const succeeded = new Set();
                const failed = new Set();
                let count = 0;
                const total = imageSet.size;

                imageSet.forEach(imgName => {
                    const img = new Image();
                    img.onload = () => {
                        succeeded.add(imgName);
                        count++;
                        if (isPass1) {
                            completedCount++;
                            updateProgress();
                        }
                        if (count >= total) resolve({ succeeded, failed });
                    };
                    img.onerror = () => {
                        failed.add(imgName);
                        count++;
                        if (isPass1) {
                            completedCount++;
                            updateProgress();
                        }
                        if (count >= total) resolve({ succeeded, failed });
                    };
                    img.src = src(imgName);
                });
            });
        }

        // --- 执行主流程 ---
        // 第 1 步：优先加载 3 张核心必备图片
        Promise.all(CORE_IMAGES.map(name => loadCoreImage(name)))
            .then(() => {
                // 第 2 步：第一轮加载其余所有图片
                return batchLoad(otherImages, true);
            })
            .then(({ failed: pass1Failed }) => {
                // 将第一轮失败的图片加入缺失集合
                pass1Failed.forEach(name => failedImages.add(name));

                // 🟢 【关键修改 1】：第一轮结束，立刻解锁 UI、解除加载按钮禁用并执行回调（立即可用）
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = "加载";
                }

                if (statusEl) {
                    if (failedImages.size > 0) {
                        statusEl.textContent = `加载完成，${failedImages.size}个资源缺失`;
                        statusEl.style.color = "red";
                    } else {
                        statusEl.textContent = "加载完成！";
                        statusEl.style.color = "blue";
                    }
                    setTimeout(() => {
                        if (statusEl && (statusEl.textContent.includes("加载完成") || statusEl.textContent.includes("资源缺失"))) {
                            statusEl.textContent = "";
                        }
                    }, 2500);
                }

                // 立即让用户开始使用（禁用第一轮缺失的按钮）
                if (callback) callback(failedImages);

                // 🟢 【关键修改 2】：完全后台静默执行第二轮复检（不阻塞任何操作）
                if (pass1Failed.size > 0) {
                    batchLoad(pass1Failed, false).then(({ succeeded: recoveredImages }) => {
                        // 如果后台复检发现有之前漏掉的图片重新加载成功了
                        if (recoveredImages.size > 0) {
                            // 从缺失集合中移除恢复成功的图片
                            recoveredImages.forEach(name => failedImages.delete(name));

                            // 提示用户
                            if (statusEl) {
                                statusEl.textContent = `已重新加载(${recoveredImages.size})个缺失图片`;
                                statusEl.style.color = "green";
                                setTimeout(() => { if (statusEl) statusEl.textContent = ""; }, 3000);
                            }

                            // 动态解封之前误禁用的按钮
                            unlockRecoveredButtons(failedImages);
                        }
                    });
                }
            });
    }

    /* ========= 辅助函数：后台补救成功后，动态解除对应按钮的禁用 ========= */
    function unlockRecoveredButtons(currentFailedSet) {
        // 1. 检查并解封表情按钮
        for (let faceName in faces) {
            const requiredImages = faces[faceName];
            const isStillBroken = requiredImages.some((img, index) => {
                if (index === 1 || index === 2) return false;
                return currentFailedSet.has(img);
            });

            if (!isStillBroken) {
                const btn = document.getElementById("face_" + faceName);
                if (btn && btn.classList.contains("disabled")) {
                    btn.classList.remove("disabled");
                    btn.title = "";
                }
            }
        }

        // 2. 检查并解封配件按钮
        Object.keys(acc).forEach(accName => {
            if (!currentFailedSet.has(accName)) {
                const btn = document.querySelector(`button[onclick*="'${accName}'"]`);
                if (btn && btn.classList.contains("disabled")) {
                    btn.classList.remove("disabled");
                    btn.title = "";
                }
            }
        });

        // 3. 检查说话模式
        if (typeof talkSeqFrames !== 'undefined') {
            const seqBroken = talkSeqFrames.some(img => currentFailedSet.has(img));
            if (!seqBroken) {
                const btn = document.querySelector(`button[onclick*="setTalkMode(2"]`);
                if (btn && btn.classList.contains("disabled")) {
                    btn.classList.remove("disabled");
                }
            }
        }
    }

    /* ========= 检查并禁用损坏按钮 ========= */
    function checkBrokenResources(failedSet) {
        if (failedSet.size === 0) return;

        for (let faceName in faces) {
            const requiredImages = faces[faceName];
            const isBroken = requiredImages.some((img, index) => {
                if (index === 1 || index === 2) return false;
                return failedSet.has(img);
            });

            const btn = document.getElementById("face_" + faceName);
            if (btn && isBroken) {
                btn.classList.add("disabled");
                btn.title = "资源缺失，无法显示";
            }
        }

        Object.keys(acc).forEach(accName => {
            if (failedSet.has(accName)) {
                const btn = document.querySelector(`button[onclick*="'${accName}'"]`);
                if (btn) {
                    btn.classList.add("disabled");
                    btn.title = "配件丢失";
                }
            }
        });

        const randomBroken = talkRandomFrames.some(img => failedSet.has(img));
        if (randomBroken) {
            const btn = document.querySelector(`button[onclick*="setTalkMode(1"]`);
            if (btn) btn.classList.add("disabled");
        }

        const seqBroken = talkSeqFrames.some(img => failedSet.has(img));
        if (seqBroken) {
            const btn = document.querySelector(`button[onclick*="setTalkMode(2"]`);
            if (btn) btn.classList.add("disabled");
        }
    }

    /* ========= 加载角色 ========= */
    function loadChar() {
        const charInput = document.getElementById("charId");
        const id = charInput.value.trim();
        if (!id) return;

        setCookie("saved_char_id", id, 30);

        charPath = "https://data.seicing.com/seicingdepot/fatcatpool/essay/chara/" + id + "/";

        // 更新金色角色名字
        updateSpeakerName(id);

        if (talkTimer) clearInterval(talkTimer);
        if (dialogueTimer) clearTimeout(dialogueTimer);
        talking = false;
        isTyping = false;

        const talkBtn = document.getElementById("talkBtn");
        if (talkBtn) talkBtn.classList.remove("active");

        base.src = src("base");
        eye.src = "";
        brow.src = "";
        mouth.src = "";

        Object.values(acc).forEach(x => {
            x.style.display = "none";
            x.src = "";
        });
        document.querySelectorAll(".accBtn").forEach(b => b.classList.remove("active"));

        isClosedEyes = false;
        const closeEyeBtn = document.getElementById("closeEyeBtn");
        if (closeEyeBtn) closeEyeBtn.classList.remove("active");

        document.querySelectorAll("button.disabled").forEach(b => {
            b.classList.remove("disabled");
            b.title = "";
        });

        preloadImages((failedSet) => {
            checkBrokenResources(failedSet);

            const mode1Btn = document.querySelector('button[onclick*="setTalkMode(1"]');
            const mode2Btn = document.querySelector('button[onclick*="setTalkMode(2"]');
            const hasMouthAni1 = !failedSet.has("mouth_ani1");

            if (hasMouthAni1) {
                if (mode2Btn) setTalkMode(2, mode2Btn);
            } else {
                if (mode1Btn) setTalkMode(1, mode1Btn);
            }

            let defaultFace = Object.keys(faces).find(faceName => {
                const req = faces[faceName];
                return !failedSet.has(req[0]) && !failedSet.has(req[3]) && !failedSet.has(req[4]);
            }) || Object.keys(faces)[0];

            setFace(defaultFace, true);
            startBlink();
        });
    }

    /* ========= 表情设置 ========= */
    function setFace(name, isInit = false) {
        const btn = document.getElementById("face_" + name);

        if (!isInit && btn && btn.classList.contains("disabled")) {
            console.warn(`表情 ${name} 资源缺失，跳过切换`);
            return;
        }

        currentFace = faces[name];
        if (!currentFace) return;

        if (isClosedEyes) {
            eye.src = src(currentFace[2]);
        } else {
            eye.src = src(currentFace[0]);
        }

        brow.src = src(currentFace[3]);
        mouth.src = src(currentFace[4]);

        document.querySelectorAll(".faceBtn").forEach(b => b.classList.remove("active"));
        if (btn) btn.classList.add("active");
    }

    /* ========= 闭眼逻辑 ========= */
    function toggleCloseEyes(btn) {
        isClosedEyes = !isClosedEyes;
        btn.classList.toggle("active", isClosedEyes);

        if (isClosedEyes) {
            if (blinkTimer) clearTimeout(blinkTimer);
            eye.src = src(currentFace[2]);
        } else {
            eye.src = src(currentFace[0]);
            startBlink();
        }
    }

    /* ========= 眨眼 ========= */
    function startBlink() {
        if (blinkTimer) clearTimeout(blinkTimer);
        if (isClosedEyes) return;

        function blinkOnce() {
            if (isClosedEyes) return;

            const seq = [
                currentFace[0],
                currentFace[1],
                currentFace[2],
                currentFace[1],
                currentFace[0]
            ];
            let i = 0;

            function step() {
                if (!isClosedEyes) eye.src = src(seq[i]);

                let delay = blinkFrameTime;
                if (i === 2) delay *= blinkHoldFactor;
                i++;

                if (i < seq.length) {
                    setTimeout(step, delay);
                } else {
                    scheduleNext();
                }
            }
            step();
        }

        function scheduleNext() {
            if (isClosedEyes) return;
            blinkTimer = setTimeout(
                blinkOnce,
                blinkMin + Math.random() * (blinkMax - blinkMin)
            );
        }
        scheduleNext();
    }

    /* ========= 说话 ========= */
    function toggleTalk(btn) {
        talking = !talking;
        btn.classList.toggle("active", talking);

        if (talking) {
            let i = 0;
            talkTimer = setInterval(() => {
                if (talkMode === 1) {
                    mouth.src = src(talkRandomFrames[i % talkRandomFrames.length]);
                    i++;
                } else {
                    mouth.src = src(talkSeqFrames[i % talkSeqFrames.length]);
                    i++;
                }
            }, 120);
        } else {
            clearInterval(talkTimer);
            mouth.src = src(currentFace[4]);
        }
    }

    function setTalkMode(mode, btn) {
        if (btn.classList.contains("disabled")) return;

        talkMode = mode;
        document.querySelectorAll(".talkModeBtn")
            .forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
    }

    /* ========= 配件 ========= */
    function toggleAcc(name, btn) {
        if (btn.classList.contains("disabled")) return;

        const el = acc[name];
        if (!el.src || el.src.endsWith(".html") || el.src == "") {
            el.src = src(name);
        }

        const isHidden = (el.style.display === "none" || el.style.display === "");

        if (isHidden) {
            el.style.display = "block";
            btn.classList.add("active");
        } else {
            el.style.display = "none";
            btn.classList.remove("active");
        }
    }

    /* ========= 初始化表情按钮 ========= */
    const box = document.getElementById("faces");
    for (let k in faces) {
        const b = document.createElement("button");
        b.textContent = k;
        b.id = "face_" + k;
        b.className = "faceBtn";
        b.onclick = () => setFace(k, false);
        box.appendChild(b);
    }

    /* ========= 对话系统 ========= */
    let dialogueTimer = null;
    let isTyping = false;

    const BASE_DELAY = 75;
    const PUNCTUATION_MULTIPLIER = 2.5;
    const END_TALK_DELAY = 400;

    function startDialogue(text) {
        if (isTyping) {
            clearTimeout(dialogueTimer);
            isTyping = false;
        }
        isTyping = true;

        const textEl = document.getElementById("dialogueText");
        textEl.textContent = "";

        let index = 0;

        if (!talking) {
            toggleTalk(document.getElementById("talkBtn"));
        }

        function typeNext() {
            const char = text[index];
            textEl.textContent += char;
            index++;

            if (!talking) {
                toggleTalk(document.getElementById("talkBtn"));
            }

            if (index >= text.length) {
                isTyping = false;
                setTimeout(() => {
                    if (talking) {
                        toggleTalk(document.getElementById("talkBtn"));
                    }
                }, END_TALK_DELAY);
                return;
            }

            const isPunctuation = /[，。！？；：,.!?;~……]/.test(char);
            const delay = isPunctuation
                ? BASE_DELAY * PUNCTUATION_MULTIPLIER
                : BASE_DELAY;

            dialogueTimer = setTimeout(typeNext, delay);
        }

        typeNext();
    }

    /* ========= 自定义对话 & Cookie 记忆 ========= */
    const COOKIE_KEY = "saved_custom_dialogue";
    const customInput = document.getElementById("customDialogueInput");

    // 初始化时从 Cookie 恢复文本
    const savedDialogue = getCookie(COOKIE_KEY);
    if (savedDialogue) {
        customInput.value = savedDialogue;
    } else {
        customInput.value = "请输入自定义对话内容"; // 默认初始值
    }

    // 实时监听输入，写入 Cookie
    customInput.addEventListener("input", () => {
        setCookie(COOKIE_KEY, customInput.value, 30);
    });

    function playCustomDialogue() {
        const text = customInput.value.trim();
        if (!text) return;
        setCookie(COOKIE_KEY, text, 30);
        startDialogue(text);
    }

    /* ========= 全局事件委托：保证无论怎么复制到手机抽屉，点击都永远有效 ========= */
    document.addEventListener("click", (e) => {
        // 寻找被点击的头像元素
        const img = e.target.closest(".avatar-wrap img");
        if (img && img.dataset.charId) {
            const charId = document.getElementById("charId");
            if (charId) {
                charId.value = img.dataset.charId;
                loadChar();
            }
        }
    });

    /* ========= 加载并改造 lavivagnar.html ========= */
    function loadLavivagnar() {
        fetch('https://seicing.com/js/list/lavivagnar.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`lavivagnar.html 加载失败: ${response.status}`);
                }
                return response.text();
            })
            .then(html => {
                function buildAvatarList(isSidebar = false) {
                    const temp = document.createElement("div");
                    temp.innerHTML = html;

                    const list = temp.querySelector("#listlavivagnar");
                    if (!list) return null;

                    list.style.float = "left";
                    list.style.width = "220px";
                    if (isSidebar) {
                        list.classList.add("sidebar-lavivagnar");
                    }

                    // 解封特殊形态
                    const specialForms = list.querySelectorAll('#specialForms, div[style*="display: none"], div[style*="display:none"]');
                    specialForms.forEach(el => el.style.display = "block");

                    // 清理多余元素
                    const bigfonter = list.querySelector("#bigfonter");
                    const darkmoder = list.querySelector("#darkmoder");
                    if (bigfonter) bigfonter.remove();
                    if (darkmoder) darkmoder.remove();

                    list.querySelectorAll('a.special-text-link').forEach(a => a.remove());
                    list.querySelectorAll("b").forEach(b => {
                        if (!b.textContent.trim() && !b.querySelector("img")) b.remove();
                    });
                    list.querySelectorAll("br").forEach(br => br.remove());

                    const walker = document.createTreeWalker(list, NodeFilter.SHOW_TEXT, null, false);
                    const emptyTextNodes = [];
                    while (walker.nextNode()) {
                        if (!walker.currentNode.textContent.trim()) emptyTextNodes.push(walker.currentNode);
                    }
                    emptyTextNodes.forEach(node => node.remove());

                    // 转换 <a> 为 <span>
                    list.querySelectorAll("a").forEach(a => {
                        const replacement = document.createElement("span");
                        replacement.className = "avatar-wrap";
                        for (const attr of a.attributes) {
                            if (attr.name.toLowerCase() !== "href") {
                                replacement.setAttribute(attr.name, attr.value);
                            }
                        }
                        while (a.firstChild) replacement.appendChild(a.firstChild);
                        a.replaceWith(replacement);
                    });

                    // 为头像打上 data 标识并插入角标
                    list.querySelectorAll("img").forEach(img => {
                        img.style.cursor = "pointer";
                        const imgSrc = img.getAttribute("src") || "";
                        const cleanSrc = imgSrc.split("?")[0].split("#")[0];
                        const fileName = cleanSrc.substring(cleanSrc.lastIndexOf("/") + 1);
                        const name = fileName.replace(/\.[^.]+$/, "");

                        if (!name) return;

                        // 🟢 关键：标记角色 ID，供全局事件委托拾取
                        img.dataset.charId = name;

                        if (fullyAnimatedList.includes(name)) {
                            const badge = document.createElement("img");
                            badge.src = BADGE_IMG_SRC;
                            badge.className = "avatar-badge";
                            if (img.parentNode) img.parentNode.appendChild(badge);
                        }
                    });

                    return list;
                }

                // 1. 注入底部常规容器
                const mainContainer = document.getElementById("lavivagnar");
                if (mainContainer) {
                    const mainList = buildAvatarList(false);
                    if (mainList) mainContainer.replaceChildren(mainList);
                }

                // 2. 注入侧边栏容器
                const sidebarContainer = document.getElementById("sidebarLavivagnar") || document.getElementById("sidebar") || document.querySelector(".sidebar");
                if (sidebarContainer) {
                    const sidebarList = buildAvatarList(true);
                    if (sidebarList) {
                        sidebarContainer.appendChild(sidebarList);
                    }
                }

                // 3. （可选）如果手机抽屉容器已经存在于页面上，也直接注入一份
                const mobileDrawer = document.querySelector(".mobile-drawer-container") || document.getElementById("mobile-drawer-container");
                if (mobileDrawer && !sidebarContainer) {
                    const drawerList = buildAvatarList(true);
                    if (drawerList) mobileDrawer.appendChild(drawerList);
                }
            })
            .catch(error => {
                console.error("加载 lavivagnar 失败:", error);
            });
    }

    const savedCharId = getCookie("saved_char_id");
    const charInput = document.getElementById("charId");
    if (savedCharId && charInput) {
        charInput.value = savedCharId;
    }

    // 初始化运行
    loadCharNameMap();
    loadLavivagnar();
    loadChar();
</script>

</html>
