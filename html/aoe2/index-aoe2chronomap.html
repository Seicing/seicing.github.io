        padding-bottom: 5px;
        border-bottom: var(--hr-color);

        justify-content: space-between;
        align-items: baseline;
    }

    .campaign-section-title small {
        font-size: 0.6em;
        color: var(--text-sidebar-a);
    }

    .level-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 30px;
    }

    .level-card {
        background-color: var(--bg-table-highlight);
        border: var(--border-table);
        border-radius: 2px;
        overflow: hidden;
        text-align: center;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        display: flex;
        flex-direction: column;
    }

    .level-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .level-card .img-container {
        width: 100%;
        height: 100%;
        background-color: var(--bg-body-color);
        overflow: hidden;
        border-bottom: var(--border-table);
    }

    .level-card .img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .level-card .card-caption {
        color: var(--text-primary);
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    @media only screen and (max-width: 767px) {
        .level-grid {
            grid-template-columns: repeat(2, 1fr) !important;

    <script>
        (function () {
            const getCookie = (name) => {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            };
            const theme = getCookie('theme') || 'light';
            if (theme === 'dark') {
                document.body.classList.add('theme-dark');
            }
        })();
    </script>

    function initCampaignPage() {
        const filtersContainer = document.getElementById('filters');
        const campaignContainer = document.getElementById('campaignContainer');

        filtersContainer.innerHTML = '';
        campaignContainer.innerHTML = '';

        campaignsData.forEach((camp, index) => {
            // A. 生成战役过滤按钮
            const btn = document.createElement('button');
            btn.className = `filterbtn ${index === 0 ? 'active' : ''}`;
            btn.dataset.filter = camp.id;
            btn.innerText = camp.name;
            btn.onclick = () => switchCampaign(camp.id);
            filtersContainer.appendChild(btn);

            // B. 生成战役区块 (Section)
            const section = document.createElement('div');
            section.className = `campaign-section ${index === 0 ? 'active' : ''}`;
            section.id = `camp-${camp.id}`;

            const grid = document.createElement('div');
            grid.className = 'level-grid';

            camp.levels.forEach(level => {
                const card = document.createElement('div');
                card.className = 'level-card';

                // 判断当前展示 path 还是 path2（无path2时回退使用path）
                const path2Url = level.path2 && level.path2.trim() !== "" ? level.path2 : level.path;
                const currentPath = isPath2Active ? path2Url : level.path;

                // 将 path 和 path2 分别保存在 data- 属性中，方便后续无缝切换
                card.innerHTML = `
                    <div class="img-container">
                        <img class="level-img" 
                             src="${currentPath}" 
                             data-path1="${level.path}" 
                             data-path2="${path2Url}" 
                             alt="${level.title}" 
                             onerror="this.style.opacity='0.2'">
                    </div>
                    <div class="card-caption">
                        <span class="title-cn">${level.title}</span>
                        <span class="title-en">${level.title_eng}</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            section.appendChild(grid);
            campaignContainer.appendChild(section);
        });

        // URL 参数定位
        const urlCamp = new URLSearchParams(window.location.search).get("camp");
        if (urlCamp) {
            switchCampaign(urlCamp);
        }

        const toggleBtn = document.createElement('button');
        toggleBtn.id = 'mapTypeToggleBtn';
        toggleBtn.className = `filterbtn ${isPath2Active ? 'active' : ''}`;
        toggleBtn.innerText = '切换成选关图小地图';
        toggleBtn.onclick = toggleMapType;
        filtersContainer.appendChild(toggleBtn);
    }

    // =====================================================================
    // 3. 战役切换控制逻辑
    // =====================================================================
    function switchCampaign(campId) {
        document.querySelectorAll('#filters .filterbtn[data-filter]').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === campId);
        });

        document.querySelectorAll('.campaign-section').forEach(sec => {
            sec.classList.toggle('active', sec.id === `camp-${campId}`);
        });

        const url = new URL(window.location);
        url.searchParams.set("camp", campId);
        window.history.replaceState({}, "", url);
    }

    // =====================================================================
    // 4. 地图类型切换逻辑 (Path1 <-> Path2)
    // =====================================================================
    function toggleMapType() {
        isPath2Active = !isPath2Active;

        // 切换按钮高亮状态
        const toggleBtn = document.getElementById('mapTypeToggleBtn');
        if (toggleBtn) {
            toggleBtn.classList.toggle('active', isPath2Active);
        }

        // 遍历所有卡片图片并更新 src
        document.querySelectorAll('.level-img').forEach(img => {
            const newSrc = isPath2Active ? img.dataset.path2 : img.dataset.path1;
            if (newSrc) {
                img.src = newSrc;
            }
        });
    }

    // 文档加载就绪后运行初始化
    document.addEventListener('DOMContentLoaded', initCampaignPage);
</script>

</html>
