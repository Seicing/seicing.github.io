<style>
    /* 统一间距变量 */
    :root {
        --grid-gap: 8px;
    }

    #filters.campaign-filter-panel {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
        padding: 12px;
        border-radius: 4px;
    }

    .filterbtn {
        background-color: transparent;
        color: var(--btn-inactive-color);
        border: var(--border-table);
        padding: 6px 14px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
        font-family: inherit;
        transition: all 0.2s ease;
    }

    .filterbtn:hover {
        color: var(--text-title);
        background-color: var(--bg-body-color);
    }

    .filterbtn.active {
        background-color: var(--btn-active-color) !important;
        color: #ffffff !important;
        border-color: var(--btn-active-color) !important;
    }

    .campaign-section {
        display: none;
    }

    .campaign-section.active {
        display: block;
    }

    .campaign-section-title {
        color: var(--text-title);
        margin-bottom: 15px;
        padding-bottom: 5px;
        border-bottom: var(--hr-color);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }

    /* 网格通用基准 */
    .level-grid {
        display: grid;
        gap: var(--grid-gap);
        margin-bottom: 12px;
    }

    /* 无章节：4个地图均分 100% */
    .level-grid.no-chapter {
        grid-template-columns: repeat(4, 1fr);
    }

    /* 有章节：章节占80px，3张地图保持标准25%宽度，右侧自然留空 */
    .level-grid.has-chapter {
        grid-template-columns: 80px repeat(3, calc((100% - 3 * var(--grid-gap)) / 4));
    }

    .level-card {
        background-color: var(--bg-table-highlight);
        border: var(--border-table);
        border-radius: 2px;
        overflow: hidden;
        text-align: center;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }

    .level-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
    }

    /* 地图卡片图片：强制 1:1 正方形 */
    .level-card .img-container {
        width: 100%;
        aspect-ratio: 1 / 1;
        background-color: var(--bg-body-color);
        overflow: hidden;
        border-bottom: var(--border-table);
    }

    .level-card .img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    /* 标题与超链接 */
    .level-card .card-caption {
        color: var(--text-primary);
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 4px 2px;
    }

    .level-card .card-caption a.title-link {
        text-decoration: none;
        color: inherit;
        display: block;
    }

    .level-card .card-caption a.title-link:hover .title-cn {
        color: var(--btn-active-color);
        text-decoration: underline;
    }

    .title-cn {
        font-size: 12px;
        font-weight: bold;
        color: var(--text-title);
        display: block;
        word-break: break-all;
    }

    .title-en {
        font-size: 10px;
        color: var(--text-sidebar-a);
        display: block;
        word-break: break-all;
    }

    .year-tag {
        margin-right: 3px;
        color: var(--btn-active-color);
    }

    /* 章节卡片 (固定80px宽) */
    .level-card.chapter-card {
        width: 100%;
        background-color: var(--bg-body-color);
        border: var(--border-table);
        justify-content: center;
        align-items: center;
        padding: 6px 2px;
        box-sizing: border-box;
    }

    .chapter-card .chapter-icon-wrap {
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 6px;
    }

    .chapter-card .chapter-icon-wrap img {
        width: 50px;
        height: auto;
        max-height: 50px;
        object-fit: contain;
    }

    .chapter-card .chapter-name {
        font-size: 12px;
        font-weight: bold;
        color: var(--text-title);
        line-height: 1.2;
    }

    /* 手机模式：消除右侧空隙，3张地图平分剩余宽度填满屏幕 */
    @media only screen and (max-width: 767px) {
        :root {
            --grid-gap: 4px;
        }

        .level-grid {
            margin-bottom: 8px;
        }

        /* 手机端：章节55px，其余3张地图平分剩余100%空间，空隙消失 */
        .level-grid.has-chapter {
            grid-template-columns: 55px repeat(3, 1fr);
        }

        .level-grid.no-chapter {
            grid-template-columns: repeat(4, 1fr);
        }

        .chapter-card .chapter-icon-wrap {
            width: 30px;
            height: 30px;
            margin-bottom: 2px;
        }

        .chapter-card .chapter-icon-wrap img {
            width: 30px;
            max-height: 30px;
        }

        .chapter-card .chapter-name {
            font-size: 9px;
        }

        .title-cn {
            font-size: 9px;
            line-height: 1.1;
        }

        .title-en {
            font-size: 8px;
            line-height: 1.1;
            transform: scale(0.88);
        }

        .level-card .card-caption {
            padding: 2px 1px;
        }
    }
</style>

    <script>
        (function () {
            const getCookie = (name) => {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            };
            const theme = getCookie('theme') || 'light';
            if (theme === 'dark') {
                document.body.classList.add('theme-dark');
            }
        })();
    </script>

    // =====================================================================
    // 单张地图卡片 DOM 生成函数
    // =====================================================================
    function createMapCard(level) {
        let year = level.year || "";
        let cleanTitle = level.title || "";

        // 如果没有单独写 year，尝试从 title 自动提取开头的数字年份（如 "1066 黑斯廷斯战役"）
        if (!year) {
            const match = cleanTitle.match(/^(\d{3,4})\s*(.*)/);
            if (match) {
                year = match[1];
                cleanTitle = match[2];
            }
        }

        // 超链接去除年份数字，指向纯标题 HTML
        const linkUrl = `https://seicing.com/html/aoe2/cam4/${cleanTitle}.html`;
        const displayTitle = year ? `<span class="year-tag">${year}</span>${cleanTitle}` : cleanTitle;
        const displayEng = level.title_eng || "";

        const card = document.createElement('div');
        card.className = 'level-card map-card';
        card.innerHTML = `
            <div class="img-container">
                <a href="${linkUrl}">
                    <img src="${level.path}" alt="${cleanTitle}" onerror="this.style.opacity='0.2'">
                </a>
            </div>
            <div class="card-caption">
                <a href="${linkUrl}" class="title-link">
                    <span class="title-cn">${displayTitle}</span>
                    <span class="title-en">${displayEng}</span>
                </a>
            </div>
        `;
        return card;
    }

    // =====================================================================
    // 页面构建逻辑 (支持按章节分行：80px章节+3正方形地图 或 4正方形地图)
    // =====================================================================
    function initCampaignPage() {
        const filtersContainer = document.getElementById('filters');
        const campaignContainer = document.getElementById('campaignContainer');

        filtersContainer.innerHTML = '';
        campaignContainer.innerHTML = '';

        campaignsData.forEach((camp, index) => {
            // A. 生成控制台按钮
            const btn = document.createElement('button');
            btn.className = `filterbtn ${index === 0 ? 'active' : ''}`;
            btn.dataset.filter = camp.id;
            btn.innerText = camp.name;
            btn.onclick = () => switchCampaign(camp.id);
            filtersContainer.appendChild(btn);

            // B. 生成战役区块 (Section)
            const section = document.createElement('div');
            section.className = `campaign-section ${index === 0 ? 'active' : ''}`;
            section.id = `camp-${camp.id}`;

            // 标题区
            const titleDiv = document.createElement('div');
            titleDiv.className = 'campaign-section-title';
            titleDiv.innerHTML = `${camp.name}`;
            section.appendChild(titleDiv);

            // C. 动态按行构建关卡网格
            const levels = camp.levels;
            let i = 0;

            while (i < levels.length) {
                const currentLevel = levels[i];
                const hasChapter = !!currentLevel.chapter;

                const rowGrid = document.createElement('div');

                if (hasChapter) {
                    rowGrid.className = 'level-grid has-chapter'; // 应用 80px 1fr 1fr 1fr
                    const chapterRaw = currentLevel.chapter;
                    const chapterDisplayName = chapterRaw.replace(/\d+$/g, ''); // 剔除末尾数字

                    // 1. 生成左侧章节卡片 (80px宽)
                    const chapterCard = document.createElement('div');
                    chapterCard.className = 'level-card chapter-card';
                    chapterCard.innerHTML = `
                        <div class="chapter-icon-wrap">
                            <img src="https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/cam/chapter/${chapterRaw}.png" alt="${chapterDisplayName}" onerror="this.style.display='none'">
                        </div>
                        <div class="chapter-name">${chapterDisplayName}</div>
                    `;
                    rowGrid.appendChild(chapterCard);

                    // 2. 填入最多 3 张正方形地图
                    let count = 0;
                    while (i < levels.length && count < 3) {
                        if (count > 0 && levels[i].chapter && levels[i].chapter !== chapterRaw) {
                            break;
                        }
                        rowGrid.appendChild(createMapCard(levels[i]));
                        i++;
                        count++;
                    }
                } else {
                    rowGrid.className = 'level-grid no-chapter'; // 应用 1fr 1fr 1fr 1fr
                    // 没有章节：填入最多 4 张正方形地图
                    let count = 0;
                    while (i < levels.length && count < 4 && !levels[i].chapter) {
                        rowGrid.appendChild(createMapCard(levels[i]));
                        i++;
                        count++;
                    }
                }

                section.appendChild(rowGrid);
            }

            campaignContainer.appendChild(section);
        });

        const urlCamp = new URLSearchParams(window.location.search).get("camp");
        if (urlCamp) {
            switchCampaign(urlCamp);
        }
    }

    // =====================================================================
    // 战役切换控制逻辑
    // =====================================================================
    function switchCampaign(campId) {
        document.querySelectorAll('#filters .filterbtn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === campId);
        });

        document.querySelectorAll('.campaign-section').forEach(sec => {
            sec.classList.toggle('active', sec.id === `camp-${campId}`);
        });

        const url = new URL(window.location);
        url.searchParams.set("camp", campId);
        window.history.replaceState({}, "", url);
    }

    document.addEventListener('DOMContentLoaded', initCampaignPage);
</script>
