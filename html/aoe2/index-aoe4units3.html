    @media screen and (max-width: 820px) {

    .table-size-btn.active,

        color: white;
        border-color: #50473E;
    }

    /* 兵种选择栏 (去除常规按钮框，纯图标 + 橙色渐变外发光) */
    .unit-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        margin-bottom: 12px;
    }

    .unit-act-btn {
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        cursor: pointer;
        outline: none;
        display: inline-flex;
        justify-content: center;
        align-items: center;
    }

    .unit-act-btn img {
        width: 36px;
        height: 36px;
        display: block;
        transition: filter 0.2s ease, transform 0.2s ease;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
    }

    /* 激活状态：3px/6px 橙色发光光晕 */
    .unit-act-btn.active img {
        filter: drop-shadow(0 0 3px #ff8c00) drop-shadow(0 0 6px #ff8c00);
        transform: scale(1.12);
    }

    /* 表格与 5 列样式 */
    #customers {
        width: 800px;
        max-width: 100%;
        margin: 0 auto;
        border-collapse: separate;
        border-spacing: 8px 10px;
        /* 列间距 8px，行间距 10px */
        table-layout: fixed;
    }

    #customers td {
        width: 20%;
        /* 严格 5 列 = 100% / 5 */
        text-align: center;
        vertical-align: bottom;
        border: none;
        padding: 0;
        position: relative;
    }

    #customers td img {
        display: inline-block;
        max-width: 100%;
        height: auto;
        vertical-align: bottom;
    }

    /* 国旗图标容器（支持并排显示双国旗） */
    .flags-box {
        position: absolute;
        right: 2px;
        bottom: 2px;
        display: flex;
        gap: 2px;
        align-items: center;
        z-index: 10;
        pointer-events: none;
    }

    .civ-flag {
        width: 20px;
        height: 20px;
        pointer-events: none;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.8));
    }

    @media (max-width: 768px) {
        #customers {
            width: 100%;
        }
    }

    /* 多单位容器 */
    .multi-unit-box {
        display: flex;
        justify-content: space-evenly;
        align-items: flex-end;
        width: 100%;
        height: 100%;
    }

    .multi-unit-img {
        flex-shrink: 0;
    }
</style>

            hre: 'hre', otd: 'hre', eng: 'eng', hol: 'eng', fre: 'fre',

            rus: 'rus', ott: 'ott', mal: 'mal', vik: 'vik', sco: 'sco'
        };

        // 兵种分类与特色单位替代映射
        const unitCategoryMap = {
            '长矛兵': { default: '长矛兵', mac: '阿特盖尔', otd: '镀金长矛兵' },
            '武士': { default: '武士', hol: '伯爵护卫', otd: '镀金武士' },
            '侦察兵': { default: '侦察兵' },
            '骑手': { default: '骑手', otd: '镀金骑手', tug: '突袭大象', sen: '日本长枪骑兵' },
            '骑士': { default: '骑士', otd: '镀金骑士', ayy: '骆驼长矛骑兵', mac: '瑞塔利' },
            '步弓手': { default: '步弓手', zxl: '诸葛弩手', hol: '英皇侍卫', otd: '镀金步弓手', mac: '波莫' },
            '弩手': { default: '弩手', otd: '镀金弩手' },
            '火枪兵': { default: '火枪兵', sen: '火绳枪足轻', zxl: '掷弹兵', otd: '镀金火枪兵' },
            '僧侣': { default: '僧侣', jpn: '神道教神主/佛教僧侣', sen: '一向一揆僧侣', ayy: '德尔维希' },
            '骑射手': { default: '骑射手', jpn: '女武者', abb: '骆驼射手', mon: '蒙古突骑', goh: '钦察弓兵', sul: '箭塔象', hre: '黑骑兵', ayy: '沙漠掠夺者', kcr: '标枪骑兵' },
            '村民': { default: '村民男/村民女' }
        };

        // 隐藏规则
        const hidingRules = [
            { conditions: { civ: 'chi', age: [1, 2] }, actions: [{ type: 'hideImage', imageName: '武士.png' }] },
            { conditions: { civ: 'chi', age: [1, 2] }, actions: [{ type: 'hideImage', imageName: '火长矛骑兵.png' }] },
            { conditions: { civ: 'chi', age: [1, 2, 3] }, actions: [{ type: 'hideImage', imageName: '掷弹兵.png' }] },
            { conditions: { civ: 'eng', age: [1] }, actions: [{ type: 'hideImage', imageName: '长矛兵.png' }] },
            { conditions: { civ: 'otd', age: [1, 2] }, actions: [{ type: 'hideImage', imageName: '僧侣.png' }] },
            { conditions: { civ: 'tug', age: [1, 2] }, actions: [{ type: 'hideImage', imageName: '僧侣.png' }] },
            { conditions: { civ: 'byz', age: [1, 2] }, actions: [{ type: 'hideImage', imageName: '武士.png' }] },
        ];

        // 家族/形态进化规则
        const imageNameAliases = {};
        const imageFamilyRules = {
            '贞德1': {
                1: '圣女贞德农民',
                2: '圣女贞德披甲女战士',
                3: '圣女贞德骑士',
                4: '圣女贞德爆破加农炮'
            },
            '贞德2': {
                1: '',
                2: '圣女贞德猎人',
                3: '圣女贞德骑射手',
                4: '圣女贞德神射手'
            }
        };

        // 特殊无编号单位
        const specialUnitRules = {
            '国王.png': { noAgeSuffix: true, minAge: 2 },
            '猛安谋克守军.png': { noAgeSuffix: true, minAge: 3 },
            '骑马掷弹兵.png': { noAgeSuffix: true, minAge: 4 },
            '忍者.png': { noAgeSuffix: true, minAge: 2 },
            '刀剑旗本武士.png': { noAgeSuffix: true, minAge: 2 },
            '弓箭旗本武士.png': { noAgeSuffix: true, minAge: 2 },
            '骑马旗本武士.png': { noAgeSuffix: true, minAge: 2 },
            '一向一揆僧侣.png': { noAgeSuffix: true, minAge: 3 },
            '兰开斯特领主.png': { noAgeSuffix: true, minAge: 2 },
            '贝都因剑士.png': { noAgeSuffix: true, minAge: 2 },
            '贝都因掷矛手.png': { noAgeSuffix: true, minAge: 2 },
            '埃米尔战士.png': { noAgeSuffix: true, minAge: 2 },
            '肉盾.png': { noAgeSuffix: true, minAge: 1 },
            '民兵长戟兵.png': { noAgeSuffix: true, minAge: 2 },
            '民兵火枪兵.png': { noAgeSuffix: true, minAge: 3 },
            '奥斯曼军乐队.png': { noAgeSuffix: true, minAge: 2 },
            '朝圣者男.png': { noAgeSuffix: true, minAge: 1 },
            '朝圣者女.png': { noAgeSuffix: true, minAge: 1 },
            '使者.png': { noAgeSuffix: true, minAge: 1 },
            '阿塔贝格.png': { noAgeSuffix: true, minAge: 2 },
            '屋台.png': { noAgeSuffix: true, minAge: 1 },
            '圣女贞德农民.png': { noAgeSuffix: true, minAge: 1 },
            '圣女贞德披甲女战士.png': { noAgeSuffix: true, minAge: 2 },
            '圣女贞德猎人.png': { noAgeSuffix: true, minAge: 2 },
            '圣女贞德骑士.png': { noAgeSuffix: true, minAge: 3 },
            '圣女贞德骑射手.png': { noAgeSuffix: true, minAge: 3 },
            '圣女贞德爆破加农炮.png': { noAgeSuffix: true, minAge: 4 },
            '圣女贞德神射手.png': { noAgeSuffix: true, minAge: 4 },
            '贞德的骑兵.png': { noAgeSuffix: true, minAge: 2 },
            '贞德的冠军剑士.png': { noAgeSuffix: true, minAge: 2 },
        };

        // 当前状态
        let currentUnitCategory = '长矛兵';
        let currentAge = 4;
        const $table = $('#customers');

        // 当侦察兵基准原图完成加载时触发一次计算
        $('#scoutRealImg').on('load', function () {
            syncImageScales();
        });

        // 辅助函数：获取指定文明在指定时代的最终单位名
        function getFinalUnitName(civKey, age) {
            const catInfo = unitCategoryMap[currentUnitCategory] || {};
            let rawUnitName = catInfo[civKey] || catInfo.default || currentUnitCategory;

            if (imageFamilyRules[rawUnitName] && imageFamilyRules[rawUnitName][age]) {
                rawUnitName = imageFamilyRules[rawUnitName][age];
            }
            return rawUnitName;
        }

        // =========================================================
        // 生成对比表格 (一行 5 个，支持变体合并与双国旗)
        // =========================================================
        function generateTable() {
            $table.empty();
            const columnsPerRow = 5; // 每行 5 个
            let $tr = $('<tr></tr>');
            let visibleCellCount = 0;

            const isHideIcon = $('#hideIconBtn').hasClass('active');

            // 智能判定变体文明合并状态
            const mergedVariants = {};
            const civExtraFlags = {};

            Object.keys(variantParentMap).forEach(variantKey => {
                const parentKey = variantParentMap[variantKey];
                const variantUnit = getFinalUnitName(variantKey, currentAge);
                const parentUnit = getFinalUnitName(parentKey, currentAge);

                const variantHidden = isUnitHiddenByRule(variantKey, currentAge, variantUnit);
                const parentHidden = isUnitHiddenByRule(parentKey, currentAge, parentUnit);

                // 如果变体文明和本体文明图片完全相同，且均未被屏蔽，则合并显示
                if (!variantHidden && !parentHidden && variantUnit === parentUnit) {
                    mergedVariants[variantKey] = true;
                    if (!civExtraFlags[parentKey]) civExtraFlags[parentKey] = [];
                    civExtraFlags[parentKey].push(variantKey);
                }
            });

            civOrder.forEach((civKey) => {
                // 如果是被合并的变体文明，跳过独立单元格渲染
                if (mergedVariants[civKey]) return;

                const civLink = civLinkMap[civKey] || civKey;
                let rawUnitName = getFinalUnitName(civKey, currentAge);

                const $td = $('<td></td>');
                $td.attr('data-civ', civKey);

                const subUnits = rawUnitName ? rawUnitName.split('/').map(s => s.trim()) : [''];
                const validUnits = subUnits.filter(s => s !== '');

                if (validUnits.length > 1) {
                    const $box = $('<div class="multi-unit-box"></div>');
                    validUnits.forEach(subName => {
                        const imgPath = `https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/unit/${civLink}/${subName}.png`;
                        const $img = $('<img>');
                        $img.addClass('multi-unit-img');
                        $img.attr('data-aoe4unit', imgPath);
                        $img.data('original-src', imgPath);
                        $box.append($img);
                    });
                    $td.append($box);
                } else if (validUnits.length === 1) {
                    const unitName = validUnits[0];
                    const imgPath = `https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/unit/${civLink}/${unitName}.png`;
                    const $img = $('<img>');
                    $img.attr('data-aoe4unit', imgPath);
                    $img.data('original-src', imgPath);
                    $td.append($img);
                } else {
                    $td.html('&nbsp;');
                }

                // 挂载国旗容器（支持多国旗）
                const $flagsBox = $('<div class="flags-box"></div>');

                const $flag = $('<img>');
                $flag.addClass('civ-flag');
                $flag.attr('src', `https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/civicon/${civKey}.png`);
                $flagsBox.append($flag);

                // 如果有合并的变体文明，追加变体国旗
                if (civExtraFlags[civKey]) {
                    civExtraFlags[civKey].forEach(extraCiv => {
                        const $extraFlag = $('<img>');
                        $extraFlag.addClass('civ-flag');
                        $extraFlag.attr('src', `https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/civicon/${extraCiv}.png`);
                        $flagsBox.append($extraFlag);
                    });
                }

                if (isHideIcon) {
                    $flagsBox.hide();
                }
                $td.append($flagsBox);

                $tr.append($td);
                visibleCellCount++;

                // 每 5 个换一行
                if (visibleCellCount % columnsPerRow === 0) {
                    $table.append($tr);
                    $tr = $('<tr></tr>');
                }
            });

            // 补齐最后一行不足 5 列的空格
            const remaining = visibleCellCount % columnsPerRow;
            if (remaining > 0) {
                for (let i = 0; i < columnsPerRow - remaining; i++) {
                    $tr.append($('<td>&nbsp;</td>'));
                }
                $table.append($tr);
            }
        }

        // =========================================================
        // 兵种按钮点击事件
        // =========================================================
        $(document).on('click', '.unit-act-btn', function () {
            $('.unit-act-btn').removeClass('active');
            $(this).addClass('active');
            currentUnitCategory = $(this).data('unit');
            generateTable();
            updateImageSources(currentAge);
        });

        // 时代按钮点击事件
        $(document).on('click', '.age-select-btn', function () {
            if ($(this).hasClass('active')) return;
            $('.age-select-btn').removeClass('active');
            $(this).addClass('active');
            currentAge = parseInt($(this).data('age'));
            generateTable();
            updateImageSources(currentAge);
        });

        // “对齐”按钮点击事件
        $(document).on('click', '#alignBtn', function () {
            $(this).toggleClass('active');
            updateImageSources(currentAge);
        });

        // 表格尺寸控制
        $(document).on('click', '.size-btn', function () {
            $('.size-btn').removeClass('active');
            $(this).addClass('active');
            const widthPercent = parseInt($(this).data('width'));
            $('#customers').css('width', widthPercent + '%');

            $table.find('img:not(.civ-flag)').css({ width: '', 'max-width': '100%' });
            requestAnimationFrame(function () { syncImageScales(); });
        });

        // 限高控制
        $(document).on('click', '#limitHeightBtn', function () {
            $(this).toggleClass('active');
            syncImageScales();
        });

        // Hide Icon 隐藏国旗控制
        $(document).on('click', '#hideIconBtn', function () {
            $(this).toggleClass('active');
            if ($(this).hasClass('active')) {
                $('.flags-box').hide();
            } else {
                $('.flags-box').show();
            }
        });

        // =========================================================
        // 检查屏蔽规则
        // =========================================================
        function isUnitHiddenByRule(civ, age, unitName) {
            if (!civ || !unitName) return false;
            const currentCivIcon = 'CivIcon-' + civIconMap[civ] + '.png';
            let isHidden = false;
            const cleanUnitName = unitName.replace('.png', '');

            hidingRules.forEach(rule => {
                let conditionsMet = true;
                if (rule.conditions.age) {
                    if (Array.isArray(rule.conditions.age)) {
                        if (!rule.conditions.age.includes(age)) conditionsMet = false;
                    } else if (rule.conditions.age != age) {
                        conditionsMet = false;
                    }
                }
                if (rule.conditions.civ && rule.conditions.civ != civ) conditionsMet = false;
                if (rule.conditions.civIcon && rule.conditions.civIcon != currentCivIcon) conditionsMet = false;

                if (conditionsMet) {
                    rule.actions.forEach(action => {
                        if (action.type === 'hideImage') {
                            if (action.imageName.replace('.png', '') === cleanUnitName) {
                                isHidden = true;
                            }
                        }
                    });
                }
            });
            return isHidden;
        }

        // 应用隐藏规则
        function applyHidingRules(age) {
            const isAlign = $('#alignBtn').hasClass('active');
            if (isAlign) return;

            $table.find('td').each(function () {
                const civ = $(this).attr('data-civ');
                if (!civ) return;

                $(this).find('img:not(.civ-flag)').each(function () {
                    const $img = $(this);
                    const currentSrc = $img.attr('src') || '';
                    hidingRules.forEach(rule => {
                        if (rule.conditions.civ && rule.conditions.civ === civ) {
                            if (rule.conditions.age && ((Array.isArray(rule.conditions.age) && rule.conditions.age.includes(age)) || rule.conditions.age == age)) {
                                rule.actions.forEach(action => {
                                    if (action.type === 'hideImage' && currentSrc.includes(action.imageName.replace('.png', ''))) {
                                        $img.css({ 'visibility': 'hidden', 'display': 'none' });
                                    }
                                });
                            }
                        }
                    });
                });
            });
        }

        // 递归加载候选时代图片
        function loadNextAgeImage($img, civKey, unitName, ageList, index, dfd) {
            if (index >= ageList.length) {
                $img.css({ 'visibility': 'hidden', 'display': 'none' });
                dfd.resolve();
                return;
            }

            const tryAge = ageList[index];
            const civLink = civLinkMap[civKey] || civKey;
            let finalFileName = unitName;

            const familyName = imageNameAliases[unitName];
            if (familyName) {
                const familyRule = imageFamilyRules[familyName];
                if (familyRule && familyRule[tryAge]) {
                    finalFileName = familyRule[tryAge];
                }
            } else {
                const extension = unitName.substring(unitName.lastIndexOf('.'));
                const filename = unitName.substring(0, unitName.lastIndexOf('.'));
                const specialRule = specialUnitRules[unitName];

                if (specialRule && specialRule.noAgeSuffix) {
                    finalFileName = unitName;
                } else {
                    finalFileName = filename + tryAge + extension;
                }
            }

            const newSrc = `https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/unit/${civLink}/${finalFileName}`;

            $img.off('load error');
            $img.one('load', function () {
                $img.css({ 'visibility': 'visible', 'display': 'inline-block' });
                syncImageScales();
                dfd.resolve();
            }).one('error', function () {
                loadNextAgeImage($img, civKey, unitName, ageList, index + 1, dfd);
            });

            $img.attr('src', newSrc);
        }

        // 更新图片资源
        function updateImageSources(age) {
            const isAlign = $('#alignBtn').hasClass('active');
            const imageLoadPromises = [];

            $table.find('td').each(function () {
                const civKey = $(this).attr('data-civ');
                if (!civKey) return;

                const $imgs = $(this).find('img:not(.civ-flag)');
                $imgs.each(function () {
                    const $img = $(this);
                    const dfd = $.Deferred();
                    imageLoadPromises.push(dfd.promise());

                    const originalSrc = $img.data('original-src');
                    if (!originalSrc) {
                        dfd.resolve();
                        return;
                    }

                    const unitName = originalSrc.split('/').pop();
                    const specialRule = specialUnitRules[unitName];

                    let ageList = [];
                    if (isAlign) {
                        let startAge = age;
                        if (specialRule && specialRule.minAge) {
                            startAge = Math.max(age, specialRule.minAge);
                        }
                        for (let a = startAge; a <= 4; a++) {
                            if (!isUnitHiddenByRule(civKey, a, unitName)) {
                                ageList.push(a);
                            }
                        }
                    } else {
                        if (isUnitHiddenByRule(civKey, age, unitName)) {
                            ageList = [];
                        } else if (specialRule && specialRule.minAge && age < specialRule.minAge) {
                            ageList = [];
                        } else {
                            ageList = [age];
                        }
                    }

                    if (ageList.length === 0) {
                        $img.css({ 'visibility': 'hidden', 'display': 'none' });
                        dfd.resolve();
                        return;
                    }

                    loadNextAgeImage($img, civKey, unitName, ageList, 0, dfd);
                });
            });

            $.when.apply($, imageLoadPromises).done(function () {
                applyHidingRules(age);
                syncImageScales();
            });
        }

        // =========================================================
        // 同步缩放比例与裁切 (严格以侦察兵高清原图为 100% 绝对缩放基准)
        // =========================================================
        function syncImageScales() {
            // 1. 重置非国旗可见图片为默认自适应样式
            $table.find('img:not(.civ-flag)').each(function () {
                if ($(this).is(':visible')) {
                    $(this).css({
                        width: '', height: '', 'max-width': '100%',
                        'object-fit': '', 'object-position': ''
                    });
                }
            });

            // 2. 获取侦察兵 1.png 的真实 PNG 高清天然宽度
            const scoutImg = document.getElementById('scoutRealImg');
            if (!scoutImg || scoutImg.naturalWidth <= 0) return;

            const scoutNaturalWidth = scoutImg.naturalWidth; // 侦察兵真实高清宽度 (如 ~450px)

            // 3. 获取表格第一列 <td> 的实际渲染像素宽度
            const $firstTd = $table.find('td').first();
            if (!$firstTd.length) return;

            const cellWidth = $firstTd[0].getBoundingClientRect().width;
            if (cellWidth <= 0) return;

            // 核心公式：基准比例 = 单元格渲染宽度 / 侦察兵真实高清宽度
            const scaleRatio = cellWidth / scoutNaturalWidth;

            const isHeightLimited = $('#limitHeightBtn').hasClass('active');
            const scoutWidth = cellWidth;
            const maxAllowedHeight = scoutWidth * 1.5;

            // 4. 按侦察兵的 100% 严格比例计算并设置所有兵种
            $table.find('img:not(.civ-flag)').each(function () {
                const $img = $(this);
                if ($img.is(':hidden') || $img.css('visibility') === 'hidden') return;

                const naturalWidth = this.naturalWidth;
                const naturalHeight = this.naturalHeight;
                if (naturalWidth <= 0) return;

                let multiplier = 1.0;
                if ($img.hasClass('rakuda')) multiplier = 0.85;

                // 计算出每个兵种基于侦察兵比例的精确像素宽度
                const newWidth = naturalWidth * scaleRatio * multiplier;
                const currentRenderHeight = naturalHeight * scaleRatio * multiplier;
                const isNoCrop = $img.hasClass('no-crop');

                if (isHeightLimited && !isNoCrop && currentRenderHeight > maxAllowedHeight) {
                    $img.css({
                        width: newWidth + 'px',
                        height: maxAllowedHeight + 'px',
                        'max-width': 'none',
                        'object-fit': 'cover',
                        'object-position': 'bottom center',
                        'vertical-align': 'bottom',
                        'display': 'inline-block'
                    });
                } else {
                    $img.css({
                        width: newWidth + 'px',
                        height: 'auto',
                        'max-width': 'none',
                        'object-fit': '',
                        'object-position': '',
                        'vertical-align': 'bottom',
                        'display': 'inline-block'
                    });
                }
            });
        }

        // 窗口 resize 监听
        $(window).on('resize', function () {
            $table.find('img:not(.civ-flag)').css({ width: '', 'max-width': '100%' });
            setTimeout(syncImageScales, 50);
        });

        // 初始化页面
        generateTable();
        updateImageSources(currentAge);
    });

    document.addEventListener('error', function (e) {
        const target = e.target;
        if (target.tagName === 'IMG' && target.closest('#customers') && !target.classList.contains('civ-flag')) {
            target.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
        }
    }, true);
</script>

</html>
