        (function () {
            const getCookie = (name) => {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            };
            const theme = getCookie('theme') || 'light';
            if (theme === 'dark') {
                document.body.classList.add('theme-dark');
            }
        })();

        // 计算单位手动缩放乘区系数
        function getUnitScaleMultiplier($img) {
            let multiplier = 1.0;
            if ($img.hasClass('rakuda')) multiplier = 0.85;

            const originalSrc = $img.data('original-src') || $img.attr('src') || '';
            if (!originalSrc) return multiplier;

            // 获取文件名（如 "战象4.png" -> "战象4"）
            const fileName = originalSrc.split('/').pop().replace('.png', '').trim();
            // 移除末尾时代数字（如 "战象4" -> "战象"）
            const cleanName = fileName.replace(/[1-4]$/, '').trim();

            // 1. 精确名称/无时代编号匹配
            if (unitMultiplierMap[fileName] !== undefined) return unitMultiplierMap[fileName];
            if (unitMultiplierMap[cleanName] !== undefined) return unitMultiplierMap[cleanName];

            // 2. 关键词模糊匹配（如包含 "骆驼" 或 "大象"）
            for (let key in unitMultiplierMap) {
                if (fileName.includes(key) || cleanName.includes(key)) {
                    return unitMultiplierMap[key];
                }
            }

            return multiplier;
        }


        // 辅助函数：获取指定文明在指定时代的最终单位名数组（拆分 | ）
        function getFinalUnitNames(civKey, age) {
            const catInfo = unitCategoryMap[currentUnitCategory] || {};
            let rawUnitStr = catInfo[civKey] || catInfo.default || currentUnitCategory;

            if (!rawUnitStr) return [''];

            const rawList = rawUnitStr.split('|').map(s => s.trim()).filter(Boolean);

            return rawList.map(unitName => {
                let name = getSpFromOverride(civKey, age, unitName);
                if (imageFamilyRules[name] && imageFamilyRules[name][age]) {
                    name = imageFamilyRules[name][age];
                }
                return name;
            });
        }

        // 检查并获取 sp.from 精准 1 对 1 替换形态
        function getSpFromOverride(civKey, age, unitName) {
            const isSpFrom = $('#spFromBtn').hasClass('active');
            if (!isSpFrom || !unitName) return unitName;

            const cleanUnit = unitName.replace('.png', '').trim();
            const currentWithAge = cleanUnit + age; // 如 "武士4"

            for (let rule of spFromRules) {
                let matchCiv = false;
                if (Array.isArray(rule.civ)) {
                    matchCiv = rule.civ.includes(civKey);
                } else if (rule.civ) {
                    matchCiv = (rule.civ === civKey || rule.civ === 'all');
                }

                if (!matchCiv) continue;

                // 1. 匹配 fromMap 文件名 1 对 1 映射
                if (rule.fromMap) {
                    if (rule.fromMap[currentWithAge]) return rule.fromMap[currentWithAge];
                    if (rule.fromMap[cleanUnit]) return rule.fromMap[cleanUnit];
                }

                // 2. 匹配 age 时代 1 对 1 映射
                if (rule.unit === cleanUnit && rule.from) {
                    if (typeof rule.from === 'object' && rule.from[age]) {
                        return rule.from[age];
                    } else if (typeof rule.from === 'string') {
                        return rule.from;
                    }
                }
            }

            return unitName;
        }

        // =========================================================
        // 生成对比表格 (主列表智能合并，末尾同名多余单位自动合并)
        // =========================================================
        function generateTable() {
            $table.empty();
            const columnsPerRow = 5; // 每行 5 个
            let $tr = $('<tr></tr>');
            let visibleCellCount = 0;

            const isHideIcon = $('#hideIconBtn').hasClass('active');

            // 智能判定变体文明合并状态（只要主单位名称相同即可合并）
            const mergedVariants = {};
            const civExtraFlags = {};

            Object.keys(variantParentMap).forEach(variantKey => {
                const parentKey = variantParentMap[variantKey];
                const variantUnits = getFinalUnitNames(variantKey, currentAge);
                const parentUnits = getFinalUnitNames(parentKey, currentAge);

                const variantHidden = isUnitHiddenByRule(variantKey, currentAge, variantUnits[0]);
                const parentHidden = isUnitHiddenByRule(parentKey, currentAge, parentUnits[0]);

                // 变体与本体的主单位名称相同，且均未被屏蔽，即可在主表格合并
                if (!variantHidden && !parentHidden && variantUnits[0] === parentUnits[0]) {
                    mergedVariants[variantKey] = true;
                    if (!civExtraFlags[parentKey]) civExtraFlags[parentKey] = [];
                    civExtraFlags[parentKey].push(variantKey);
                }
            });

            // 存放由 | 产生的第2、第3个额外单位（用于合并去重）
            const secondaryUnitsMap = {};
            const secondaryUnitsOrder = [];

            // 1. 渲染主文明列表（只取单位列表的第 1 个单位）
            civOrder.forEach((civKey) => {
                const unitList = getFinalUnitNames(civKey, currentAge);
                const primaryUnit = unitList[0] || '';
                const secondaryList = unitList.slice(1);

                // 收集当前文明及其关联的变体国旗
                const currentFlags = [civKey];
                if (civExtraFlags[civKey]) {
                    currentFlags.push(...civExtraFlags[civKey]);
                }

                // 无论主格是否被合并，都必须将其后选的 secondary 单位收集到末尾列表中
                secondaryList.forEach(secUnit => {
                    if (!secUnit) return;

                    if (secondaryUnitsMap[secUnit]) {
                        currentFlags.forEach(f => {
                            if (!secondaryUnitsMap[secUnit].flags.includes(f)) {
                                secondaryUnitsMap[secUnit].flags.push(f);
                            }
                        });
                    } else {
                        secondaryUnitsMap[secUnit] = {
                            civKey: civKey,
                            unitName: secUnit,
                            flags: [...currentFlags]
                        };
                        secondaryUnitsOrder.push(secUnit);
                    }
                });

                // 如果是被合并的主格变体文明，跳过主格渲染（因为已合并到本体文明单元格中）
                if (mergedVariants[civKey]) return;

                // 生成主单元格
                const $td = createUnitCell(civKey, primaryUnit, currentFlags, isHideIcon);
                $tr.append($td);
                visibleCellCount++;

                // 每 5 个换一行
                if (visibleCellCount % columnsPerRow === 0) {
                    $table.append($tr);
                    $tr = $('<tr></tr>');
                }
            });

            // 补齐主列表最后一行的空格
            const remaining = visibleCellCount % columnsPerRow;
            if (remaining > 0) {
                for (let i = 0; i < columnsPerRow - remaining; i++) {
                    $tr.append($('<td>&nbsp;</td>'));
                }
                $table.append($tr);
            }

            // 2. 渲染带有 | 的后续单位（同名单位已完美合并国旗，独立成格）
            if (secondaryUnitsOrder.length > 0) {
                let $secTr = $('<tr></tr>');
                let secCount = 0;

                secondaryUnitsOrder.forEach(secUnitName => {
                    const item = secondaryUnitsMap[secUnitName];
                    const $secTd = createUnitCell(item.civKey, item.unitName, item.flags, isHideIcon);
                    $secTr.append($secTd);
                    secCount++;

                    if (secCount % columnsPerRow === 0) {
                        $table.append($secTr);
                        $secTr = $('<tr></tr>');
                    }
                });

                // 补齐次级列表最后一行的空格
                const secRemaining = secCount % columnsPerRow;
                if (secRemaining > 0) {
                    for (let i = 0; i < columnsPerRow - secRemaining; i++) {
                        $secTr.append($('<td>&nbsp;</td>'));
                    }
                    $table.append($secTr);
                }
            }
        }

        // =========================================================
        // 检查屏蔽规则
        // =========================================================
        function isUnitHiddenByRule(civ, age, unitName) {
            if (!civ || !unitName) return false;
            const currentCivIcon = 'CivIcon-' + civIconMap[civ] + '.png';
            let isHidden = false;
            const cleanUnitName = unitName.replace('.png', '');

            hidingRules.forEach(rule => {
                let conditionsMet = true;
                if (rule.conditions.age) {
                    if (Array.isArray(rule.conditions.age)) {
                        if (!rule.conditions.age.includes(age)) conditionsMet = false;
                    } else if (rule.conditions.age != age) {
                        conditionsMet = false;
                    }
                }
                if (rule.conditions.civ && rule.conditions.civ != civ) conditionsMet = false;
                if (rule.conditions.civIcon && rule.conditions.civIcon != currentCivIcon) conditionsMet = false;

                if (conditionsMet) {
                    rule.actions.forEach(action => {
                        if (action.type === 'hideImage') {
                            if (action.imageName.replace('.png', '') === cleanUnitName) {
                                isHidden = true;
                            }
                        }
                    });
                }
            });
            return isHidden;
        }

        // 应用隐藏规则
        function applyHidingRules(age) {
            const isAlign = $('#alignBtn').hasClass('active');
            if (isAlign) return;

            $table.find('td').each(function () {
                const civ = $(this).attr('data-civ');
                if (!civ) return;

                $(this).find('img:not(.civ-flag)').each(function () {
                    const $img = $(this);
                    const currentSrc = $img.attr('src') || '';
                    hidingRules.forEach(rule => {
                        if (rule.conditions.civ && rule.conditions.civ === civ) {
                            if (rule.conditions.age && ((Array.isArray(rule.conditions.age) && rule.conditions.age.includes(age)) || rule.conditions.age == age)) {
                                rule.actions.forEach(action => {
                                    if (action.type === 'hideImage' && currentSrc.includes(action.imageName.replace('.png', ''))) {
                                        $img.css({ 'visibility': 'hidden', 'display': 'none' });
                                    }
                                });
                            }
                        }
                    });
                });
            });
        }

        // 递归加载候选时代图片
        function loadNextAgeImage($img, civKey, unitName, ageList, index, dfd) {
            if (index >= ageList.length) {
                $img.css({ 'visibility': 'hidden', 'display': 'none' });
                dfd.resolve();
                return;
            }

            const tryAge = ageList[index];
            const civLink = civLinkMap[civKey] || civKey;
            let finalFileName = unitName;

            const familyName = imageNameAliases[unitName];
            if (familyName) {
                const familyRule = imageFamilyRules[familyName];
                if (familyRule && familyRule[tryAge]) {
                    finalFileName = familyRule[tryAge];
                }
            } else {
                const extension = unitName.substring(unitName.lastIndexOf('.'));
                const filename = unitName.substring(0, unitName.lastIndexOf('.'));
                const specialRule = specialUnitRules[unitName];

                if (specialRule && specialRule.noAgeSuffix) {
                    finalFileName = unitName;
                } else {
                    finalFileName = filename + tryAge + extension;
                }
            }

            const newSrc = `https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/unit/${civLink}/${finalFileName}`;

            $img.off('load error');
            $img.one('load', function () {
                $img.css({ 'visibility': 'visible', 'display': 'inline-block' });
                syncImageScales();
                dfd.resolve();
            }).one('error', function () {
                loadNextAgeImage($img, civKey, unitName, ageList, index + 1, dfd);
            });

            $img.attr('src', newSrc);
        }

        // 更新图片资源
        function updateImageSources(age) {
            const isAlign = $('#alignBtn').hasClass('active');
            const imageLoadPromises = [];

            $table.find('td').each(function () {
                const civKey = $(this).attr('data-civ');
                if (!civKey) return;

                const $imgs = $(this).find('img:not(.civ-flag)');
                $imgs.each(function () {
                    const $img = $(this);
                    const dfd = $.Deferred();
                    imageLoadPromises.push(dfd.promise());

                    const originalSrc = $img.data('original-src');
                    if (!originalSrc) {
                        dfd.resolve();
                        return;
                    }

                    const unitName = originalSrc.split('/').pop();
                    const specialRule = specialUnitRules[unitName];

                    let ageList = [];
                    if (isAlign) {
                        let startAge = age;
                        if (specialRule && specialRule.minAge) {
                            startAge = Math.max(age, specialRule.minAge);
                        }
                        for (let a = startAge; a <= 4; a++) {
                            if (!isUnitHiddenByRule(civKey, a, unitName)) {
                                ageList.push(a);
                            }
                        }
                    } else {
                        if (isUnitHiddenByRule(civKey, age, unitName)) {
                            ageList = [];
                        } else if (specialRule && specialRule.minAge && age < specialRule.minAge) {
                            ageList = [];
                        } else {
                            ageList = [age];
                        }
                    }

                    if (ageList.length === 0) {
                        $img.css({ 'visibility': 'hidden', 'display': 'none' });
                        dfd.resolve();
                        return;
                    }

                    loadNextAgeImage($img, civKey, unitName, ageList, 0, dfd);
                });
            });

            $.when.apply($, imageLoadPromises).done(function () {
                applyHidingRules(age);
                syncImageScales();
            });
        }

        // =========================================================
        // 高清透明底 PNG 导出 (智能检测：仅在图片飘出时动态增加安全缓冲区)
        // =========================================================
        $(document).on('click', '#exportPngBtn', function () {
            const $btn = $(this);
            $btn.text('导出中...');

            const $tableEl = $('#customers');
            const el = $tableEl[0];

            // 1. 临时保存原样式，并在后台瞬时清除限高，防止截图插件压扁小人
            const $imgs = $tableEl.find('img:not(.civ-flag)');
            const originalStyles = [];
            const originalTablePadding = $tableEl.css('padding');

            $imgs.each(function () {
                const $img = $(this);
                originalStyles.push({
                    $img: $img,
                    width: $img.css('width'),
                    height: $img.css('height'),
                    maxWidth: $img.css('max-width'),
                    objectFit: $img.css('object-fit'),
                    objectPosition: $img.css('object-position')
                });

                // 瞬时恢复自适应高度
                $img.css({
                    height: 'auto',
                    'object-fit': '',
                    'object-position': ''
                });
            });

            // 2. 智能检测是否有图片/武器飘出表格左右边界
            const tableRect = el.getBoundingClientRect();
            let maxLeftOverflow = 0;
            let maxRightOverflow = 0;

            $imgs.each(function () {
                const $img = $(this);
                if ($img.is(':hidden') || $img.css('visibility') === 'hidden') return;

                const imgRect = this.getBoundingClientRect();
                if (imgRect.width <= 0 || imgRect.height <= 0) return;

                // 检测左侧向外突出距离
                if (imgRect.left < tableRect.left - 2) {
                    const diffLeft = tableRect.left - imgRect.left;
                    if (diffLeft > maxLeftOverflow) maxLeftOverflow = diffLeft;
                }
                // 检测右侧向外突出距离
                if (imgRect.right > tableRect.right + 2) {
                    const diffRight = imgRect.right - tableRect.right;
                    if (diffRight > maxRightOverflow) maxRightOverflow = diffRight;
                }
            });

            // 3. 仅在检测到飘出时，动态计算精准的安全内边距（溢出距离 + 25px 余量）；无飘出则保持原样
            if (maxLeftOverflow > 0 || maxRightOverflow > 0) {
                const padLeft = maxLeftOverflow > 0 ? Math.ceil(maxLeftOverflow + 25) + 'px' : '0px';
                const padRight = maxRightOverflow > 0 ? Math.ceil(maxRightOverflow + 25) + 'px' : '0px';
                $tableEl.css({
                    'padding-left': padLeft,
                    'padding-right': padRight
                });
            }

            // 4. 使用 2倍高清截图
            html2canvas(el, {
                backgroundColor: null,     // 100% 透明背景
                useCORS: true,             // 支持跨域图片
                scale: 2,                  // 2倍高清
                width: el.scrollWidth,     // 捕获完整内容宽度
                height: el.scrollHeight    // 捕获完整高度
            }).then(canvas => {
                // 5. 下载图片
                const a = document.createElement('a');
                const titleText = (typeof currentCiv !== 'undefined') ? currentCiv : currentUnitCategory;
                a.download = `AOE4_${titleText}_Age${currentAge}.png`;
                a.href = canvas.toDataURL('image/png');
                a.click();

                // 6. 截图完毕，立刻恢复原样
                $tableEl.css('padding', originalTablePadding);
                originalStyles.forEach(item => {
                    item.$img.css({
                        width: item.width,
                        height: item.height,
                        'max-width': item.maxWidth,
                        'object-fit': item.objectFit,
                        'object-position': item.objectPosition
                    });
                });

                $btn.text('导出PNG');
            }).catch(err => {
                console.error('导出失败:', err);
                // 发生错误时也要还原样式
                $tableEl.css('padding', originalTablePadding);
                originalStyles.forEach(item => {
                    item.$img.css({
                        width: item.width,
                        height: item.height,
                        'max-width': item.maxWidth,
                        'object-fit': item.objectFit,
                        'object-position': item.objectPosition
                    });
                });
                alert('导出图片失败，请检查网络或跨域设置。');
                $btn.text('导出PNG');
            });
        });

        // =========================================================
        // 同步缩放比例与裁切 (支持单位专属坐标偏移)
        // =========================================================
        function syncImageScales() {
            // 1. 重置非国旗可见图片为默认自适应样式
            $table.find('img:not(.civ-flag)').each(function () {
                if ($(this).is(':visible')) {
                    $(this).css({
                        width: '', height: '', 'max-width': '100%',
                        'object-fit': '', 'object-position': ''
                    });
                }
            });

            // 2. 获取侦察兵 1.png 的真实 PNG 高清天然宽度
            const scoutImg = document.getElementById('scoutRealImg');
            if (!scoutImg || scoutImg.naturalWidth <= 0) return;

            const scoutNaturalWidth = scoutImg.naturalWidth;

            // 3. 获取表格第一列 <td> 的实际渲染像素宽度
            const $firstTd = $table.find('td').first();
            if (!$firstTd.length) return;

            const cellWidth = $firstTd[0].getBoundingClientRect().width;
            if (cellWidth <= 0) return;

            // 核心公式：基准比例 = 单元格渲染宽度 / 侦察兵真实高清宽度
            const scaleRatio = cellWidth / scoutNaturalWidth;

            const isHeightLimited = $('#limitHeightBtn').hasClass('active');
            const scoutWidth = cellWidth;

            // 整个长矛兵分类统一自动使用 1.05 裁切上限，其他分类使用 1.5
            let limitRatio = 1.5;
            if (currentUnitCategory === '长矛兵') {
                limitRatio = 1.05;
            }
            const maxAllowedHeight = scoutWidth * limitRatio;

            // 4. 按侦察兵的 100% 严格比例计算并设置所有兵种
            $table.find('img:not(.civ-flag)').each(function () {
                const $img = $(this);
                if ($img.is(':hidden') || $img.css('visibility') === 'hidden') return;

                const naturalWidth = this.naturalWidth;
                const naturalHeight = this.naturalHeight;
                if (naturalWidth <= 0) return;

                // 获取手动配置的缩放乘区系数
                const multiplier = getUnitScaleMultiplier($img);

                // 计算出每个兵种基于侦察兵比例的精确像素宽度
                const newWidth = naturalWidth * scaleRatio * multiplier;
                const currentRenderHeight = naturalHeight * scaleRatio * multiplier;
                const isNoCrop = $img.hasClass('no-crop');

                if (isHeightLimited && !isNoCrop && currentRenderHeight > maxAllowedHeight) {
                    $img.css({
                        width: newWidth + 'px',
                        height: maxAllowedHeight + 'px',   // 强制高度上限
                        'max-width': 'none',
                        'object-fit': 'cover',             // 保持原有宽度不变形
                        'object-position': 'bottom center', // 底部对齐，裁切顶部
                        'vertical-align': 'bottom',
                        'display': 'inline-block'
                    });
                } else {
                    $img.css({
                        width: newWidth + 'px',
                        height: 'auto',
                        'max-width': 'none',
                        'object-fit': '',
                        'object-position': '',
                        'vertical-align': 'bottom',
                        'display': 'inline-block'
                    });
                }

                // =========================================================
                // 【新增】应用特定文明单位坐标偏移 (精准从父级 td 识别文明)
                // =========================================================
                const tdCiv = $img.closest('td').attr('data-civ') || '';
                const unitName = $img.attr('data-unit-name') || '';
                const originalSrc = $img.data('original-src') || $img.attr('src') || '';
                const fileName = originalSrc.split('/').pop() || '';

                const offsetRule = getUnitOffsetRule(tdCiv, unitName) || getUnitOffsetRule(tdCiv, fileName);

                if (offsetRule) {
                    $img.css({
                        'position': 'relative',
                        'left': offsetRule.left || '',
                        'right': offsetRule.right || '',
                        'top': offsetRule.top || '',
                        'bottom': offsetRule.bottom || '',
                        'transform': offsetRule.transform || ''
                    });
                } else {
                    $img.css({
                        'position': '',
                        'left': '',
                        'right': '',
                        'top': '',
                        'bottom': '',
                        'transform': ''
                    });
                }
            });
        }

        // 窗口 resize 监听
        $(window).on('resize', function () {
            $table.find('img:not(.civ-flag)').css({ width: '', 'max-width': '100%' });
            setTimeout(syncImageScales, 50);
        });

        // 初始化页面
        generateTable();
        updateImageSources(currentAge);
    });

    document.addEventListener('error', function (e) {
        const target = e.target;
        if (target.tagName === 'IMG' && target.closest('#customers') && !target.classList.contains('civ-flag')) {
            target.src = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
        }
    }, true);
</script>

</html>
