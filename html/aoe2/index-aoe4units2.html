    <script>
        (function () {
            const getCookie = (name) => {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            };
            const theme = getCookie('theme') || 'light';
            if (theme === 'dark') {
                document.body.classList.add('theme-dark');
            }
        })();

        // =========================================================
        // 自动生成表格（支持 世代进化、跨格标签、不裁切、''空白占位）
        // =========================================================
        function generateTable() {
            $table.empty();
            const civData = civTables.find(c => c.civname === currentCiv);
            if (!civData) return;
            const units = civData.civunits;

            let $tr = $('<tr></tr>');
            let currentSpans = 0; // 记录当前行已占用的列数(上限 5)

            let inGroup = false;
            let groupSpan = 1;
            let groupUnits = [];

            let inNoCrop = false; // 是否开启不裁切模式

            // 渲染单元格闭包函数
            function renderCell(cellSpan, unitObjs) {
                if (currentSpans + cellSpan > 5) {
                    while (currentSpans < 5) {
                        $tr.append($('<td>&nbsp;</td>'));
                        currentSpans++;
                    }
                    $table.append($tr);
                    $tr = $('<tr></tr>');
                    currentSpans = 0;
                }

                const $td = $('<td></td>');
                if (cellSpan > 1) {
                    $td.attr('colspan', cellSpan);
                }

                const validUnits = unitObjs.filter(u => u.name !== '');

                // 多单位格
                if (validUnits.length > 1) {
                    const $box = $('<div class="multi-unit-box"></div>');

                    validUnits.forEach(uObj => {
                        const subName = uObj.name;
                        const imgPath = `https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/unit/${currentCivLink}/${subName}.png`;
                        const $img = $('<img>');
                        $img.addClass('multi-unit-img');
                        if (uObj.noCrop) $img.addClass('no-crop');

                        $img.attr('data-aoe4unit', imgPath);
                        $img.data('original-src', imgPath);
                        $box.append($img);
                    });

                    $td.append($box);
                }
                // 单单位格
                else if (validUnits.length === 1) {
                    const uObj = validUnits[0];
                    const unitName = uObj.name;
                    const imgPath = `https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/unit/${currentCivLink}/${unitName}.png`;
                    const $img = $('<img>');
                    if (uObj.noCrop) $img.addClass('no-crop');

                    $img.attr('data-aoe4unit', imgPath);
                    $img.data('original-src', imgPath);
                    $td.append($img);
                }
                // 纯空白格 ''
                else {
                    $td.html('&nbsp;');
                }

                $tr.append($td);
                currentSpans += cellSpan;
            }

            units.forEach(item => {
                if (item === null || item === undefined) return;

                // 核心改动：检查该单位是否定义了【世代进化规则】
                let actualItem = item.trim();
                if (imageFamilyRules[actualItem] && imageFamilyRules[actualItem][currentAge]) {
                    actualItem = imageFamilyRules[actualItem][currentAge];
                }

                // 1. 检查【不裁切开始标签】
                if (/^(?:不裁切|nocrop|no-crop)$/i.test(actualItem)) {
                    inNoCrop = true;
                    return;
                }
                // 2. 检查【不裁切结束标签】
                if (/^(?:不裁切结束|nocrop:end|endnocrop|\/nocrop)$/i.test(actualItem)) {
                    inNoCrop = false;
                    return;
                }

                // 3. 检查【跨格开头标签】(如 "标签5", "span:5")
                const startMatch = actualItem.match(/^(?:span|标签)[:\s=]?(\d+)/i);
                if (startMatch) {
                    inGroup = true;
                    groupSpan = Math.min(parseInt(startMatch[1]), 5);
                    groupUnits = [];
                    return;
                }

                // 4. 检查【跨格结束标签】(如 "终止标签", "span:end")
                const isEnd = /^(?:end|span:end|终止标签|\/span)$/i.test(actualItem);
                if (isEnd && inGroup) {
                    renderCell(groupSpan, groupUnits);
                    inGroup = false;
                    groupSpan = 1;
                    groupUnits = [];
                    return;
                }

                // 5. 如果在跨格标签内部，收集单位
                if (inGroup) {
                    groupUnits.push({ name: actualItem, noCrop: inNoCrop });
                    return;
                }

                // 6. 空白占位标签 '' 渲染为空格子
                if (actualItem === '') {
                    renderCell(1, [{ name: '', noCrop: false }]);
                }
                // 7. 斜杠单行多单位 "A/B" (包括进化出来的骑兵/冠军剑士)
                else if (actualItem.includes('/')) {
                    const subUnits = actualItem.split('/').map(s => s.trim());
                    let cellSpan = 1;
                    if (subUnits.length >= 6) cellSpan = 5;
                    else if (subUnits.length === 5) cellSpan = 4;
                    else if (subUnits.length === 4) cellSpan = 3;
                    else if (subUnits.length === 3) cellSpan = 2;

                    const uObjs = subUnits.map(name => ({ name: name, noCrop: inNoCrop }));
                    renderCell(cellSpan, uObjs);
                }
                // 8. 普通单单位
                else {
                    renderCell(1, [{ name: actualItem, noCrop: inNoCrop }]);
                }
            });

            if (inGroup && groupUnits.length > 0) {
                renderCell(groupSpan, groupUnits);
            }

            if (currentSpans > 0) {
                while (currentSpans < 5) {
                    $tr.append($('<td>&nbsp;</td>'));
                    currentSpans++;
                }
                $table.append($tr);
            }
        }

        // =========================================================
        // 判断某个单位在指定时代是否被 hidingRules 屏蔽
        // =========================================================
        function isUnitHiddenByRule(civ, age, unitName) {
            if (!civ || !unitName) return false;
            const currentCivIcon = 'CivIcon-' + civIconMap[civ] + '.png';
            let isHidden = false;
            const cleanUnitName = unitName.replace('.png', '');

            hidingRules.forEach(rule => {
                let conditionsMet = true;
                if (rule.conditions.age) {
                    if (Array.isArray(rule.conditions.age)) {
                        if (!rule.conditions.age.includes(age)) conditionsMet = false;
                    } else if (rule.conditions.age != age) {
                        conditionsMet = false;
                    }
                }
                if (rule.conditions.civ && rule.conditions.civ != civ) conditionsMet = false;
                if (rule.conditions.civIcon && rule.conditions.civIcon != currentCivIcon) conditionsMet = false;

                if (conditionsMet) {
                    rule.actions.forEach(action => {
                        if (action.type === 'hideImage') {
                            const ruleImageName = action.imageName.replace('.png', '');
                            if (ruleImageName === cleanUnitName) {
                                isHidden = true;
                            }
                        }
                    });
                }
            });

            return isHidden;
        }

        // =========================================================
        // 应用隐藏规则
        // =========================================================
        function applyHidingRules(age) {
            const isAlign = $('#alignBtn').hasClass('active');
            // 开启“对齐”时，以 updateImageSources 算出的解锁时代为准，跳过二次强行隐藏
            if (isAlign) return;

            const currentCivIcon =
                'CivIcon-' +
                civIconMap[currentCiv] +
                '.png';
            hidingRules.forEach(rule => {
                let conditionsMet = true;
                if (rule.conditions.age) {
                    if (Array.isArray(rule.conditions.age)) {
                        if (!rule.conditions.age.includes(age)) conditionsMet = false;
                    } else if (rule.conditions.age != age) {
                        conditionsMet = false;
                    }
                }
                if (
                    rule.conditions.civ &&
                    rule.conditions.civ != currentCiv
                ) {
                    conditionsMet = false;
                }
                if (
                    rule.conditions.civIcon &&
                    rule.conditions.civIcon != currentCivIcon
                ) {
                    conditionsMet = false;
                }
                if (!conditionsMet)
                    return;

                rule.actions.forEach(action => {
                    if (
                        action.type ===
                        'hideImagesInColumns'
                    ) {
                        $table.find(
                            'td:nth-child(n+' +
                            action.from +
                            ') img'
                        ).css({
                            'visibility': 'hidden',
                            'display': 'none'
                        });
                    }
                    if (
                        action.type ===
                        'hideImage'
                    ) {
                        $table.find('td img')
                            .each(function () {
                                const $img =
                                    $(this);
                                const currentSrc =
                                    $img.attr('src') || '';
                                if (
                                    currentSrc.includes(
                                        action.imageName.replace('.png', '')
                                    )
                                ) {
                                    $img.css({
                                        'visibility': 'hidden',
                                        'display': 'none'
                                    });
                                }
                            });
                    }
                });
            });
        }


        // =========================================================
        // 递归加载候选时代的图片
        // =========================================================
        function loadNextAgeImage($img, unitName, ageList, index, dfd) {
            if (index >= ageList.length) {
                $img.css({ 'visibility': 'hidden', 'display': 'none' });
                dfd.resolve();
                return;
            }

            const tryAge = ageList[index];
            let finalFileName = unitName;

            // 家族规则
            const familyName = imageNameAliases[unitName];
            if (familyName) {
                const familyRule = imageFamilyRules[familyName];
                if (familyRule && familyRule[tryAge]) {
                    finalFileName = familyRule[tryAge];
                }
            } else {
                const extension = unitName.substring(unitName.lastIndexOf('.'));
                const filename = unitName.substring(0, unitName.lastIndexOf('.'));
                const specialRule = specialUnitRules[unitName];

                if (specialRule && specialRule.noAgeSuffix) {
                    finalFileName = unitName;
                } else {
                    finalFileName = filename + tryAge + extension;
                }
            }

            const newSrc = `https://data.seicing.com/seicingdepot/3fatcatpool/aoe4/unit/${currentCivLink}/${finalFileName}`;

            $img.off('load error');
            $img.one('load', function () {
                $img.css({ 'visibility': 'visible', 'display': 'inline-block' });
                syncImageScales();
                dfd.resolve();
            }).one('error', function () {
                loadNextAgeImage($img, unitName, ageList, index + 1, dfd);
            });

            $img.attr('src', newSrc);
        }



        // =========================================================
        // 更新图片
        // =========================================================
        function updateImageSources(age) {
            const isAlign = $('#alignBtn').hasClass('active');
            const imageLoadPromises = [];
            const $imagesToLoad = $table.find('img');

            $imagesToLoad.each(function () {
                const $img = $(this);
                const dfd = $.Deferred();
                imageLoadPromises.push(dfd.promise());

                const originalSrc = $img.data('original-src');
                if (!originalSrc) {
                    dfd.resolve();
                    return;
                }

                const unitName = originalSrc.split('/').pop();
                const specialRule = specialUnitRules[unitName];

                let ageList = [];
                if (isAlign) {
                    let startAge = age;
                    if (specialRule && specialRule.minAge) {
                        startAge = Math.max(age, specialRule.minAge);
                    }
                    // 开启对齐：从当前时代开始往后找，跳过该文明在早期被屏蔽的时代
                    for (let a = startAge; a <= 4; a++) {
                        if (!isUnitHiddenByRule(currentCiv, a, unitName)) {
                            ageList.push(a);
                        }
                    }
                } else {
                    // 未开启对齐：如果在当前时代被屏蔽或未达到最小时代，直接隐藏
                    if (isUnitHiddenByRule(currentCiv, age, unitName)) {
                        ageList = [];
                    } else if (specialRule && specialRule.minAge && age < specialRule.minAge) {
                        ageList = [];
                    } else {
                        ageList = [age];
                    }
                }

                if (ageList.length === 0) {
                    $img.css({ 'visibility': 'hidden', 'display': 'none' });
                    dfd.resolve();
                    return;
                }

                loadNextAgeImage($img, unitName, ageList, 0, dfd);
            });

            $.when.apply($, imageLoadPromises).done(function () {
                applyHidingRules(age);
                syncImageScales();
            });
        }


        // =========================================================
        // 同步缩放（支持限高豁免卡 .no-crop）
        // =========================================================
        function syncImageScales() {
            // 重置基本样式
            $table.find('img').each(function () {
                if ($(this).is(':visible')) {
                    $(this).css({
                        width: '',
                        height: '',
                        'max-width': '100%',
                        'object-fit': '',
                        'object-position': ''
                    });
                }
            });

            let $refImage = null;
            $table.find('img').each(function () {
                const src = $(this).attr('src') || '';
                if (src.includes('侦察兵') && $(this).is(':visible')) {
                    $refImage = $(this);
                    return false;
                }
            });

            if (!$refImage || !$refImage.length) return;
            const refNaturalWidth = $refImage[0].naturalWidth;
            if (refNaturalWidth <= 0) return;

            const scoutWidth = $refImage[0].getBoundingClientRect().width;
            const scaleRatio = scoutWidth / refNaturalWidth;

            // 检查“限高”按钮状态
            const isHeightLimited = $('#limitHeightBtn').hasClass('active');
            const maxAllowedHeight = scoutWidth * 1.5;

            $table.find('img').each(function () {
                const $img = $(this);
                if ($img.is(':hidden') || $img.css('visibility') === 'hidden') return;

                const naturalWidth = this.naturalWidth;
                const naturalHeight = this.naturalHeight;
                if (naturalWidth <= 0) return;

                let multiplier = 1.0;
                if ($img.hasClass('rakuda')) {
                    multiplier = 0.85;
                } else if ($img.hasClass('elephante')) {
                    multiplier = 1.0;
                }

                const newWidth = naturalWidth * scaleRatio * multiplier;
                const currentRenderHeight = naturalHeight * scaleRatio * multiplier;

                // 检查图片是否带有 'no-crop' (不裁切) 豁免标记
                const isNoCrop = $img.hasClass('no-crop');

                // 开启限高、且没有豁免标记、且超过上限时才执行裁切
                if (isHeightLimited && !isNoCrop && currentRenderHeight > maxAllowedHeight) {
                    $img.css({
                        width: newWidth + 'px',
                        height: maxAllowedHeight + 'px',   // 强制高度上限
                        'max-width': 'none',
                        'object-fit': 'cover',             // 保持原有宽度不变形
                        'object-position': 'bottom center', // 底部对齐，裁切顶部
                        'vertical-align': 'bottom',
                        'display': 'inline-block'
                    });
                } else {
                    // 未限高 或 拥有“不裁切”豁免权：完整展示高度！
                    $img.css({
                        width: newWidth + 'px',
                        height: 'auto',
                        'max-width': 'none',
                        'object-fit': '',
                        'object-position': '',
                        'vertical-align': 'bottom',
                        'display': 'inline-block'
                    });
                }
            });
        }

        // =========================================================
        // resize
        // =========================================================
        $(window).on(
            'resize',
            function () {
                $table.find('img')
                    .css({
                        width: '',
                        'max-width':
                            '100%'
                    });
                setTimeout(
                    syncImageScales,
                    50
                );
            }
        );
        // =========================================================
        // 初始化
        // =========================================================
        generateTable();
        updateImageSources(currentAge);
    });


    document.addEventListener(
        'error',
        function (e) {

            const target = e.target;

            if (
                target.tagName === 'IMG' &&
                target.closest('#customers')
            ) {

                target.src =
                    'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';

            }

        },
        true
    );
</script>

</html>
