<style>
    #filters.campaign-filter-panel {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
        padding: 12px;
        border-radius: 4px;
    }

    .filterbtn {
        background-color: transparent;
        color: var(--btn-inactive-color);
        border: var(--border-table);
        padding: 6px 14px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
        font-family: inherit;
        transition: all 0.2s ease;
    }

    .filterbtn:hover {
        color: var(--text-title);
        background-color: var(--bg-body-color);
    }

    .filterbtn.active {
        background-color: var(--btn-active-color) !important;
        color: #ffffff !important;
        border-color: var(--btn-active-color) !important;
    }

    .campaign-section {
        display: none;
    }

    .campaign-section.active {
        display: block;
    }

    .campaign-section-title {
        color: var(--text-title);
        margin-bottom: 15px;
        padding-bottom: 5px;
        border-bottom: var(--hr-color);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
    }

    .campaign-section-title small {
        font-size: 0.6em;
        color: var(--text-sidebar-a);
    }

    .level-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-bottom: 30px;
    }

    .level-card {
        background-color: var(--bg-table-highlight);
        border: var(--border-table);
        border-radius: 2px;
        overflow: hidden;
        text-align: center;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        display: flex;
        flex-direction: column;
    }

    .level-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .level-card .img-container {
        width: 100%;
        height: 110px;
        background-color: var(--bg-body-color);
        overflow: hidden;
        border-bottom: var(--border-table);
    }

    .level-card .img-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .level-card .card-caption {
        color: var(--text-primary);
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    @media only screen and (max-width: 767px) {
        .level-grid {
            grid-template-columns: repeat(2, 1fr) !important;
        }
    }
</style>

    <script>
        (function () {
            const getCookie = (name) => {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            };
            const theme = getCookie('theme') || 'light';
            if (theme === 'dark') {
                document.body.classList.add('theme-dark');
            }
        })();
    </script>

    // =====================================================================
    // 2. 页面初始化逻辑 (动态构建按钮与关卡网格)
    // =====================================================================
    function initCampaignPage() {
        const filtersContainer = document.getElementById('filters');
        const campaignContainer = document.getElementById('campaignContainer');

        filtersContainer.innerHTML = '';
        campaignContainer.innerHTML = '';

        campaignsData.forEach((camp, index) => {
            // A. 生成控制台按钮
            const btn = document.createElement('button');
            btn.className = `filterbtn ${index === 0 ? 'active' : ''}`;
            btn.dataset.filter = camp.id;
            btn.innerText = camp.name;
            btn.onclick = () => switchCampaign(camp.id);
            filtersContainer.appendChild(btn);

            // B. 生成战役区块 (Section)
            const section = document.createElement('div');
            section.className = `campaign-section ${index === 0 ? 'active' : ''}`;
            section.id = `camp-${camp.id}`;

            // 标题区
            const titleDiv = document.createElement('div');
            titleDiv.className = 'campaign-section-title';
            titleDiv.innerHTML = `${camp.name}`;
            section.appendChild(titleDiv);

            // 关卡网格 (1行4个)
            const grid = document.createElement('div');
            grid.className = 'level-grid';

            camp.levels.forEach(level => {
                const card = document.createElement('div');
                card.className = 'level-card';

                // 图片上，文本下 (格式：中文名<br>英文名)
                card.innerHTML = `
                <div class="img-container">
                    <img src="${level.path}" alt="${level.title}" onerror="this.style.opacity='0.2'">
                </div>
                <div class="card-caption">
                    <span class="title-cn">${level.title}</span>
                    <span class="title-en">${level.title_eng}</span>
                </div>
            `;
                grid.appendChild(card);
            });

            section.appendChild(grid);
            campaignContainer.appendChild(section);
        });

        // 支持 URL ?camp= 参数直接定位
        const urlCamp = new URLSearchParams(window.location.search).get("camp");
        if (urlCamp) {
            switchCampaign(urlCamp);
        }
    }

    // =====================================================================
    // 3. 战役切换控制逻辑
    // =====================================================================
    function switchCampaign(campId) {
        // 高亮对应按钮
        document.querySelectorAll('#filters .filterbtn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.filter === campId);
        });

        // 显示对应战役表格
        document.querySelectorAll('.campaign-section').forEach(sec => {
            sec.classList.toggle('active', sec.id === `camp-${campId}`);
        });

        // 更新 URL 参数 (不刷新页面)
        const url = new URL(window.location);
        url.searchParams.set("camp", campId);
        window.history.replaceState({}, "", url);
    }

    // 文档加载就绪后运行初始化
    document.addEventListener('DOMContentLoaded', initCampaignPage);
