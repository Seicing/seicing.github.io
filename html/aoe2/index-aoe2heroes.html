    <script>
        (function () {
            const getCookie = (name) => {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            };
            const theme = getCookie('theme') || 'light';
            if (theme === 'dark') {
                document.body.classList.add('theme-dark');
            }
        })();

    // 1. 渲染英雄单元格：严禁写 src 属性，只保留 data-src 供 sheetcore.js 识别转换
    function createHeroCell(h) {
        return `
        <table style="border-collapse: collapse; margin: 4px; display: inline-table;">
            <tr>
                <td width="48px" height="48px" style="border: 0; padding: 0;">
                    <a href="https://seicing.com/html/aoe2/heroes/${h.link}">
                        <img data-src="${h.img}" width="48px" height="48px">
                    </a>
                </td>
            </tr>
            <tr>
                <td width="48px" style="border: 0; padding: 2px 0 0 0; text-align: center; font-size: 12px; line-height: 1.2;">
                    <a href="https://seicing.com/html/aoe2/heroes/${h.link}" class="special-link">${h.name}</a>
                </td>
            </tr>
        </table>`;
    }

    // 2. 初始化加载
    $(document).ready(function () {
        $('#civ-filter-container').load('https://seicing.com/js/list/side_aoe2_civ.html', function () {
            $(this).find('#techno123').hide();
        });

        // 初始渲染全部英雄
        renderHeroes(heroLibrary);
    });

    // 3. 渲染英雄列表
    function renderHeroes(data) {
        let container = $('#filtered-heroes-container');
        let html = "";

        if (data === heroLibrary) {
            // 完整默认视图：版本列 -> 分类列 -> 英雄区
            const versions = [...new Set(heroLibrary.map(h => h.version))];

            versions.forEach(ver => {
                const types = [...new Set(heroLibrary.filter(h => h.version === ver).map(h => h.type))];
                html += `<table id="customers2">`;

                types.forEach((t, index) => {
                    html += `<tr>`;
                    // 版本列通过 rowspan 合并居中
                    if (index === 0) {
                        html += `
                        <td width="70px" rowspan="${types.length}" class="bcF5F8FA" style="vertical-align: middle; text-align: center;">
                            <img src="https://data.seicing.com/seicingdepot/3fatcatpool/aoe2/version/${ver}.png" width="40px"><br><b>${ver}</b>
                        </td>`;
                    }
                    // 分类列独立靠左展示
                    html += `<td width="75px" style="vertical-align: middle; text-align: center; font-weight: bold; background-color: rgba(255,255,255,0.03);">${t}</td>`;

                    // 英雄列表展示区
                    html += `<td style="vertical-align: middle; text-align: left;"><div style="display: flex; flex-wrap: wrap;">`;
                    heroLibrary.filter(h => h.version === ver && h.type === t).forEach(h => {
                        html += createHeroCell(h);
                    });
                    html += `</div></td>`;

                    html += `</tr>`;
                });

                html += `</table>`;
            });
        } else {
            // 剔除筛选模式：平铺展示
            html = `<table id="customers2"><tr><td style="text-align: left; vertical-align: middle;"><div style="display: flex; flex-wrap: wrap;">`;
            data.forEach(h => html += createHeroCell(h));
            html += `</div></td></tr></table>`;
        }

        container.html(html);

        // 触发 sheet 扫描加载
        triggerSheetScanner();
    }

    // 4. 触发 sheetcore.js 扫描
    function triggerSheetScanner() {
        // 确保新节点已挂载到 DOM，单次派发事件让 sheetcore 执行识别
        document.dispatchEvent(new Event('DOMContentLoaded'));
    }

    // 5. 点击文明图标进行剔除/恢复
    $(document).on('click', '#civ-filter-container img', function () {
        const civ = $(this).attr('title');
        if ($(this).hasClass('active-civ')) {
            // 再次点击取消剔除
            $(this).removeClass('active-civ');
            renderHeroes(heroLibrary);
        } else {
            // 点击剔除该文明的英雄
            $('#civ-filter-container img').removeClass('active-civ');
            $(this).addClass('active-civ');
            renderHeroes(heroLibrary.filter(h => !h.civ.includes(civ)));
        }
    });
</script>
