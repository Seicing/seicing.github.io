    <script>
        (function () {
            const getCookie = (name) => {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                    if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
                }
                return null;
            };
            const theme = getCookie('theme') || 'light';
            if (theme === 'dark') {
                document.body.classList.add('theme-dark');
            }
        })();

    $(document).ready(function () {
        // 1. 注入侧边栏国籍图标
        $('#civ-selector-container').load('https://seicing.com/js/list/side_aoe2_civ.html', function () {
            // 给图标绑定点击筛选事件
            $("#civ-selector-container img").click(function () {
                $(this).toggleClass("active-civ");
                filterHeroes();
            });
        });

        // 2. 初始化生成英雄列表
        renderHeroes(heroLibrary);
    });

    // 2. 渲染函数（已适配 data-src 和你的表格结构）
    function renderHeroes(data) {
        // 按版本和类型分组
        const groups = data.reduce((acc, hero) => {
            if (!acc[hero.version]) acc[hero.version] = {};
            if (!acc[hero.version][hero.type]) acc[hero.version][hero.type] = [];
            acc[hero.version][hero.type].push(hero);
            return acc;
        }, {});

        let html = '<table id="customers2">';

        for (let version in groups) {
            let rowspan = Object.keys(groups[version]).length;
            let isFirstType = true;

            for (let type in groups[version]) {
                html += `<tr>`;
                // 如果是该版本的第一个类型，渲染版本列
                if (isFirstType) {
                    html += `<td width="60px" rowspan="${rowspan}" class="bcF5F8FA"><img src="https://data.seicing.com/seicingdepot/3fatcatpool/aoe2/version/${version}.png" width="40px"><br>${version}</td>`;
                    isFirstType = false;
                }

                html += `<td rowspan="1" width="60" class="bcF5F8FA">${type}</td>`;
                html += `<td style="text-align:left;"><div style="display: flex; flex-wrap: wrap; border: 0; align-items: flex-start;">`;

                // 渲染该分类下的所有英雄
                groups[version][type].forEach(h => {
                    html += `
                <div class="hero-card" data-civs="${h.civ.join(',')}">
                    <table style="border-collapse: collapse; margin: 2px;">
                        <tr><td width="48px" height="48px" style="border: 0;">
                            <a href="https://seicing.com/html/aoe2/heroes/${h.link}">
                                <img data-src="https://data.seicing.com/seicingdepot/3fatcatpool/aoe2/common/${h.img}" width="48px">
                            </a>
                        </td></tr>
                        <tr><td width="48px" style="border: 0;text-align: center">
                            <a href="https://seicing.com/html/aoe2/heroes/${h.link}" class="special-link">${h.name}</a>
                        </td></tr>
                    </table>
                </div>`;
                });

                html += `</div></td></tr>`;
            }
        }
        html += `</table>`;
        $('#hero-display-area').html(html);
    }

    function filterHeroes() {
        // 获取所有被选中的国籍（即有 active-civ 样式的图标的 title）
        const selectedCivs = $("#civ-selector-container img.active-civ").map(function () {
            return $(this).attr("title");
        }).get();

        // 如果没有选中任何图标，则全部显示
        if (selectedCivs.length === 0) {
            $(".hero-card").show();
        } else {
            $(".hero-card").each(function () {
                const heroCivs = $(this).data("civs").split(',');
                // 只要英雄的国籍数组中包含至少一个选中的国籍，就显示
                const isVisible = selectedCivs.some(civ => heroCivs.includes(civ));
                isVisible ? $(this).show() : $(this).hide();
            });
        }
    }
</script>
